        '</div>';

  window.addEventListener("unhandledrejection", function (event) {
    var root = document.getElementById("root");

      root.innerHTML =

    var loading = document.getElementById("loading");

<script>
  // window.storage ポリフィル：Claudeアーティファクト専用APIを localStorage で再現
  (function () {
    function nsKey(key, shared) {
      return (shared ? "shared:" : "personal:") + key;
    }
    window.storage = {
      async get(key, shared) {
        const raw = localStorage.getItem(nsKey(key, shared));
        if (raw === null) throw new Error("key not found: " + key);
        return { key, value: JSON.parse(raw), shared: !!shared };
      },
      async set(key, value, shared) {
        localStorage.setItem(nsKey(key, shared), JSON.stringify(value));
        return { key, value, shared: !!shared };
      },
      async delete(key, shared) {
        localStorage.removeItem(nsKey(key, shared));
        return { key, deleted: true, shared: !!shared };
      },
      async list(prefix, shared) {
        const prefixFull = nsKey(prefix || "", shared);
        const keys = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && k.startsWith(prefixFull)) keys.push(k.slice((shared ? "shared:" : "personal:").length));
        }
        return { keys, prefix, shared: !!shared };
      },
    };
  })();
</script>
