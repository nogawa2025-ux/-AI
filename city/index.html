<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>みなと市交通局</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 交通局の指令盤。上に計器帯、中央に都市の地図、下（広い画面では右）に操作パネル */
:root {
  --bg: #0c1219;
  --board: #121b26;
  --panel: #141e2b;
  --rule: #263548;
  --fg: #e5ecf3;
  --muted: #8b9aac;
  --led: #ffb547;
  --good: #4fd18b;
  --warn: #f2c94c;
  --bad: #ff6262;
  --land: #1b2632;
  --block-res: #2c4a3a;
  --block-com: #4a3f2a;
  --block-off: #2f3f5c;
  --block-ind: #4a3346;
  --block-park: #22412b;
  --water: #0b1a2c;
  --road: #4a5868;
  --road-art: #6b7b8c;
  --font-led: "DotGothic16", "Osaka-Mono", "MS Gothic", monospace;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 14px;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
#app {
  height: 100%;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "hud" "map" "panel";
}
@media (min-width: 900px) {
  #app {
    grid-template-columns: minmax(0, 1fr) 390px;
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas: "hud hud" "map panel";
  }
}
#hud {
  grid-area: hud;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 16px;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--panel);
  border-bottom: 1px solid var(--rule);
}
.brand { font-family: var(--font-led); font-size: 18px; letter-spacing: 0.08em; color: var(--led); margin-right: auto; }
.brand small { color: var(--muted); font-size: 11px; margin-left: 6px; letter-spacing: 0.15em; }
.meter { display: flex; flex-direction: column; line-height: 1.15; }
.meter .lbl { font-size: 10px; color: var(--muted); letter-spacing: 0.12em; }
.meter .val { font-family: var(--font-led); font-size: 16px; color: var(--led); font-variant-numeric: tabular-nums; text-shadow: 0 0 8px rgba(255, 181, 71, 0.35); }
.meter .val.neg { color: var(--bad); }
.speed { display: flex; gap: 4px; }
.speed button { font-family: var(--font-led); min-width: 38px; padding: 5px 6px; border-radius: 4px; border: 1px solid var(--rule); background: var(--board); color: var(--muted); cursor: pointer; }
.speed button.on { color: var(--bg); background: var(--led); border-color: var(--led); }

#mapWrap { grid-area: map; position: relative; overflow: hidden; background: var(--water); touch-action: none; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.zoom { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); bottom: 10px; display: flex; flex-direction: column; gap: 4px; }
.zoom button, .layers button { width: 36px; height: 36px; border-radius: 6px; border: 1px solid var(--rule); background: rgba(18, 27, 38, 0.92); color: var(--fg); font-size: 15px; cursor: pointer; }
.layers { position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); bottom: 10px; display: flex; gap: 4px; }
.layers button { width: auto; padding: 0 10px; font-size: 12px; }
.layers button.on { background: var(--led); color: var(--bg); border-color: var(--led); }
#legend { position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); bottom: 54px; padding: 6px 10px; border-radius: 6px; background: rgba(18, 27, 38, 0.9); border: 1px solid var(--rule); font-size: 11px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; max-width: calc(100% - 80px); }
#legend i { display: inline-block; width: 14px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
#buildBar { position: absolute; top: 10px; left: max(10px, env(safe-area-inset-left, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 12px; background: rgba(18, 27, 38, 0.96); border: 1px solid var(--led); border-radius: 8px; }
@media (max-width: 899px) {
  #buildBar { top: auto; bottom: 10px; right: calc(max(10px, env(safe-area-inset-right, 0px)) + 46px); }
  #mapWrap.building .layers, #mapWrap.building #legend { display: none; }
}
@media (min-width: 900px) { #mapWrap.building #toast { top: auto; bottom: 60px; } }
#buildBar .info { flex: 1 1 240px; min-width: 0; font-size: 13px; line-height: 1.5; }
#buildBar .info b { color: var(--led); font-family: var(--font-led); font-weight: 400; }
#buildBar .route { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
#toast { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); max-width: calc(100% - 80px); padding: 8px 14px; border-radius: 6px; background: rgba(10, 16, 24, 0.95); border: 1px solid var(--rule); font-size: 13px; pointer-events: none; transition: opacity 0.3s; }

#panel { grid-area: panel; display: flex; flex-direction: column; min-height: 0; max-height: 44vh; background: var(--panel); border-top: 1px solid var(--rule); }
@media (min-width: 900px) { #panel { max-height: none; border-top: 0; border-left: 1px solid var(--rule); } }
#tabs { display: flex; overflow-x: auto; border-bottom: 1px solid var(--rule); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
#tabs button { flex: 1 0 auto; padding: 10px 10px; background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; }
#tabs button.on { color: var(--fg); border-bottom-color: var(--led); }
#panel.collapsed #panelBody { display: none; }
#panel.collapsed #tabs button.on { border-bottom-color: transparent; }
#panelBody { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding-block: 12px 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 12px; }
h3 { margin: 0; font-size: 15px; text-wrap: balance; }
.hint { color: var(--muted); font-size: 12px; line-height: 1.6; margin: 0; }
.desc { margin: 0; font-size: 13px; line-height: 1.7; }
.btn { font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 6px; border: 1px solid var(--rule); background: var(--board); color: var(--fg); cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--led); color: var(--bg); border-color: var(--led); font-weight: 700; }
.btn.on { background: var(--led); color: var(--bg); border-color: var(--led); }
.btn.danger { color: var(--bad); border-color: rgba(255, 98, 98, 0.5); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--led); outline-offset: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.list { display: grid; gap: 6px; }
.badge { display: inline-grid; place-items: center; min-width: 30px; height: 22px; padding: 0 4px; border-radius: 11px; border: 3px solid var(--c); background: var(--fg); color: #0c1219; font-family: var(--font-led); font-size: 12px; box-sizing: border-box; }
.item { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--board); cursor: pointer; color: inherit; font: inherit; text-align: left; width: 100%; }
.item .nm { font-weight: 500; overflow-wrap: anywhere; }
.item .sub { color: var(--muted); font-size: 12px; }
.num { font-family: var(--font-led); font-variant-numeric: tabular-nums; }
.pos { color: var(--good); }
.neg { color: var(--bad); }
.wrn { color: var(--warn); }
dl.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; margin: 0; font-size: 13px; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; overflow-wrap: anywhere; }
.cards { display: grid; gap: 8px; }
.card2 { display: grid; gap: 4px; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 6px; background: var(--board); }
.card2 .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card2 .spec { color: var(--muted); font-size: 12px; line-height: 1.6; }
input[type=range] { width: 100%; accent-color: var(--led); }
.bar { height: 6px; border-radius: 3px; background: var(--rule); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--led); }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tile { padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--board); display: grid; gap: 2px; }
.tile .lbl { font-size: 11px; color: var(--muted); }
.tile .v { font-family: var(--font-led); font-size: 20px; }
.tile .s { font-size: 11px; color: var(--muted); }
.logList { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 12px; line-height: 1.5; }
.logList li { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 8px; }
.logList .d { color: var(--muted); font-family: var(--font-led); }
.goal { display: grid; gap: 4px; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--board); }
.goal.done { border-color: var(--good); }
.goal .top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.goal.done .bar > i { background: var(--good); }
canvas.chart { width: 100%; height: 120px; display: block; }
.txt { flex: 1 1 140px; min-width: 0; font: inherit; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--rule); background: var(--bg); color: var(--fg); }
.swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--board); background: var(--c); cursor: pointer; padding: 0; }
.swatch.on { border-color: var(--fg); box-shadow: 0 0 0 2px var(--c); }
details summary { cursor: pointer; }
#overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(5, 9, 14, 0.8); z-index: 20; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
#overlay .card { max-width: 500px; max-height: 86vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--rule); border-radius: 10px; padding: 20px 22px; display: grid; gap: 12px; line-height: 1.7; }
#overlay h2 { margin: 0; font-family: var(--font-led); font-weight: 400; color: var(--led); font-size: 22px; letter-spacing: 0.06em; }
#overlay ol { margin: 0; padding-left: 1.3em; font-size: 13px; }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="brand">みなと市交通局<small>運行指令所</small></div>
    <div class="meter"><span class="lbl">資金</span><span class="val" id="hMoney">—</span></div>
    <div class="meter"><span class="lbl">日時</span><span class="val" id="hDate">—</span></div>
    <div class="meter"><span class="lbl">公共交通の分担率</span><span class="val" id="hShare">—</span></div>
    <div class="meter"><span class="lbl">渋滞</span><span class="val" id="hJam">—</span></div>
    <div class="speed" id="speedBtns">
      <button data-speed="0" aria-label="一時停止">II</button>
      <button data-speed="1" aria-label="等速">1×</button>
      <button data-speed="3" aria-label="3倍速">3×</button>
      <button data-speed="10" aria-label="10倍速">10×</button>
    </div>
  </header>
  <main id="mapWrap">
    <canvas id="map"></canvas>
    <div id="buildBar" hidden></div>
    <div id="legend" hidden></div>
    <div class="layers" id="layers">
      <button data-layer="normal">地図</button>
      <button data-layer="traffic">渋滞</button>
      <button data-layer="people">人口と職場</button>
    </div>
    <div class="zoom">
      <button id="zIn" aria-label="拡大">＋</button>
      <button id="zOut" aria-label="縮小">−</button>
      <button id="zFit" aria-label="全体表示">⤢</button>
    </div>
    <div id="toast" style="opacity:0"></div>
  </main>
  <aside id="panel">
    <nav id="tabs">
      <button data-tab="lines">路線</button>
      <button data-tab="build">建設</button>
      <button data-tab="info">詳細</button>
      <button data-tab="traffic">交通</button>
      <button data-tab="money">財務</button>
      <button data-tab="log">目標</button>
    </nav>
    <div id="panelBody"></div>
  </aside>
</div>
<div id="overlay" hidden></div>

<script>
'use strict';
// ===== 基本データ =====
// 地図の1単位＝10m。時間の単位は「分」
const W = 1600, H = 1100;
const SEED = 20260401;
const SAVE_KEY = 'minato-city-transit-v1';
const REAL_SEC_PER_HOUR = 10;     // 等速時、ゲーム内1時間＝10秒
const WALK = 8;                   // 歩く速さ（単位/分）＝時速約5km
const ACCESS_R = 90;              // 駅・停留所まで歩いてもよい距離（900m）
const BASE_DATE = Date.UTC(2026, 3, 1);

const MODES = {
  bus:   { key: 'bus',   name: 'バス',     code: 'B', road: true,  speed: 45,  cap: 70,   stopCost: 5e5, segCost: 0,      vehCost: 3e6,  vehUp: 1e4,  trackUp: 0,   fare: 220, dwell: 0.5, stopCap: 160,  w: 3, unit: '台' },
  tram:  { key: 'tram',  name: '路面電車', code: 'T', road: true,  speed: 55,  cap: 160,  stopCost: 3e6, segCost: 1.5e5,  vehCost: 2e7,  vehUp: 3e4,  trackUp: 150, fare: 200, dwell: 0.5, stopCap: 320,  w: 4, unit: '編成' },
  metro: { key: 'metro', name: '地下鉄',   code: 'M', road: false, speed: 110, cap: 800,  stopCost: 8e7, segCost: 6e5,    vehCost: 6e7,  vehUp: 1.5e5, trackUp: 600, fare: 250, dwell: 0.6, stopCap: 1800, w: 5, unit: '編成' },
  rail:  { key: 'rail',  name: '郊外鉄道', code: 'R', road: false, speed: 140, cap: 1000, stopCost: 5e7, segCost: 3e5,    vehCost: 6e7,  vehUp: 1.5e5, trackUp: 400, fare: 300, dwell: 1,   stopCap: 2200, w: 5, unit: '編成' },
  ferry: { key: 'ferry', name: '水上バス', code: 'F', road: false, speed: 50,  cap: 150,  stopCost: 4e7, segCost: 0,      vehCost: 3e7,  vehUp: 4e4,  trackUp: 0,   fare: 400, dwell: 2,   stopCap: 320,  w: 3, unit: '隻' },
};
const MODE_NOTE = {
  bus: '道路を走るので、渋滞するとそのまま遅れる。安く始められる。',
  tram: '道路に線路を敷いて走る。渋滞の影響はバスの3割ほど。',
  metro: '地下を走るので渋滞と無関係で速い。建設費はとても高い。',
  rail: '地上の線路を高速で走る。地図の端の郊外とつなぐと、郊外からの通勤客を運べる。',
  ferry: '川や湾の上を走る。橋の渋滞を避けられる。',
};
const BUS_LANE_COST = 2e4;   // 専用レーン 1単位（10m）あたり
const LINE_COLORS = ['#e8423f', '#2f8fe0', '#f5a524', '#3cb371', '#a066d3', '#e86fa8', '#14b8c4', '#c9a227', '#8bc34a', '#ff7f50', '#5c7cfa', '#d9480f'];
// 出勤（家→職場）と帰宅（職場→家）の時間帯の偏り。それぞれ1日の合計が1
const OUTF = norm([0, 0, 0, 0, 0.2, 0.8, 3.5, 7, 6, 2.5, 1.2, 1, 1.2, 1, 0.9, 0.9, 0.8, 0.7, 0.6, 0.5, 0.4, 0.3, 0.2, 0.1]);
const BACKF = norm([0.1, 0, 0, 0, 0, 0.1, 0.2, 0.3, 0.4, 0.6, 0.8, 1, 1.4, 1.1, 1, 1.2, 2, 4.5, 6, 4, 2.5, 1.6, 0.9, 0.4]);
function norm(a) { const s = a.reduce((x, y) => x + y, 0); return a.map(v => v / s); }
const TRIPS_PER_PERSON = 0.85;   // 1人1日あたりの出勤（と帰宅）の回数

const BAY = [[1600, 560], [1500, 600], [1420, 700], [1360, 800], [1320, 900], [1180, 980], [1080, 1100], [1600, 1100]];
const RIVER = [[540, 0], [600, 180], [700, 330], [820, 470], [960, 600], [1100, 720], [1260, 860], [1340, 910]];
const RIVER_HALF = 17;
const CBD = { x: 640, y: 380 };
const EXTS = [
  { name: '西郊外', x: 0, y: 450, res: 36000, jobs: 3000 },
  { name: '北郊外', x: 950, y: 0, res: 28000, jobs: 2000 },
  { name: '東郊外', x: 1600, y: 450, res: 30000, jobs: 2500 },
];
const DISTRICT_NAMES = ['北野', '白山', '緑町', '旭ヶ丘', '西浜', '本町', '東雲', '川口', '錦', '港町', '若松', '南台', '桜台', '新川', '臨海', '青葉', '栄', '大手町'];
const NUMS = ['', '二丁目', '三丁目', '四丁目', '五丁目', '六丁目', '七丁目', '八丁目', '九丁目'];

const GOALS = [
  { id: 'first', label: '最初の路線を開業する', reward: 1e8, test: () => S.lines.length >= 1 },
  { id: 'riders10k', label: '1日の利用者 1万人', reward: 2e8, test: () => S.yday.rides >= 1e4 },
  { id: 'share10', label: '公共交通の分担率 10%', reward: 2e8, test: () => S.yday.share >= 0.10 },
  { id: 'metro', label: '地下鉄を開業する', reward: 3e8, test: () => S.lines.some(l => l.mode === 'metro') },
  { id: 'suburb', label: '郊外と鉄道でつなぐ', reward: 3e8, test: () => S.ext.some(e => e.served) },
  { id: 'share20', label: '公共交通の分担率 20%', reward: 4e8, test: () => S.yday.share >= 0.20 },
  { id: 'riders100k', label: '1日の利用者 10万人', reward: 5e8, test: () => S.yday.rides >= 1e5 },
  { id: 'commute', label: '平均通勤時間 28分以下', reward: 5e8, test: () => S.yday.avgT > 0 && S.yday.avgT <= 28 },
  { id: 'jam', label: '渋滞度を 30 以下に', reward: 5e8, test: () => S.yday.jam > 0 && S.yday.jam <= 30 },
  { id: 'share35', label: '公共交通の分担率 35%', reward: 1e9, test: () => S.yday.share >= 0.35 },
];

// ===== 状態 =====
let MAP;          // 地図（道路・街区）。シードから毎回同じものを作る
let S;            // 保存するゲーム状態
let ROAD = null;  // 道路の最短時間表
let TR = null;    // 公共交通の最短時間表と乗り換え案内
let FLOWS = new Map();   // 今の1時間に駅で発生する利用者（出発停留所×到着停留所 → 毎分の人数）
let view = { x: 0, y: 0, s: 1 };
let speed = 1, tab = 'lines', layer = 'normal';
let selLine = null, sel = null;   // sel: {kind:'stop'|'block'|'link', id}
let draft = null, tool = null;    // tool: 'busLane'
let pendingConfirm = null, FX = [], dirtyPanel = true;

// ===== ユーティリティ =====
const $ = s => document.querySelector(s);
const hyp = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
function rng(seed) {
  return () => {
    seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function yen(v) {
  const s = v < 0 ? '-' : '', a = Math.abs(v);
  if (a >= 1e8) return s + '¥' + (a / 1e8).toFixed(a >= 1e10 ? 0 : 1) + '億';
  if (a >= 1e4) return s + '¥' + Math.round(a / 1e4).toLocaleString() + '万';
  return s + '¥' + Math.round(a).toLocaleString();
}
const man = n => (n >= 1e4 ? (n / 1e4).toLocaleString(undefined, { maximumFractionDigits: 1 }) + '万' : Math.round(n).toLocaleString());
const pct = v => (v * 100).toFixed(1) + '%';
const dateAt = t => new Date(BASE_DATE + t * 60e3);
function dateStr(t, withTime) {
  const d = dateAt(t);
  const s = `${d.getUTCFullYear()}/${d.getUTCMonth() + 1}/${d.getUTCDate()}`;
  return withTime ? s + ' ' + String(d.getUTCHours()).padStart(2, '0') + ':' + String(Math.floor(d.getUTCMinutes() / 10) * 10).padStart(2, '0') : s;
}

    const [ax, ay] = pts[i - 1], [bx, by] = pts[i];
    const dx = bx - ax, dy = by - ay;
    const t = Math.max(0, Math.min(1, ((x - ax) * dx + (y - ay) * dy) / (dx * dx + dy * dy)));
    best = Math.min(best, hyp(x, y, ax + dx * t, ay + dy * t));

  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i], d = hyp(a.x, a.y, b.x, b.y);
    const k = Math.max(1, Math.ceil(d / 5));
    for (let j = 0; j < k; j++) {
      const t = (j + 0.5) / k, along = d0 + d * t;
      if (along < skipEnds || along > total - skipEnds) continue;

function genMap() {
  const rand = rng(SEED);
  const nodes = [], at = {};
  for (let j = 0; j <= 10; j++) for (let i = 0; i <= 15; i++) {
    let x = 50 + i * 100, y = 50 + j * 100;
    const art = i % 4 === 1 || j % 3 === 1;
    const jx = (rand() - 0.5) * 26, jy = (rand() - 0.5) * 26;
    if (!art) { x += jx; y += jy; }
    if (nearWater(x, y, 10)) continue;
    at[i + ',' + j] = nodes.length;
    nodes.push({ x, y, i, j });
  }
  let links = [];
  nodes.forEach((n, a) => {
    [[1, 0], [0, 1]].forEach(([di, dj]) => {
      const b = at[(n.i + di) + ',' + (n.j + dj)];
      if (b === undefined) return;
      const m = nodes[b];
      const art = di ? n.j % 3 === 1 : n.i % 4 === 1;
      let wet = false;
      for (let t = 0.05; t < 1; t += 0.05) if (isWater(n.x + (m.x - n.x) * t, n.y + (m.y - n.y) * t)) wet = true;
      const r = rand();
      if (wet && !art) return;
      if (!art && !wet && hyp(n.x, n.y, CBD.x, CBD.y) > 450 && r < 0.12) return;
      links.push({ a, b, art, bridge: wet });
    });
  });
  // 一番大きくつながった道路網だけ残す
  const adj = nodes.map(() => []);
  links.forEach((l, k) => { adj[l.a].push(k); adj[l.b].push(k); });
  const comp = new Array(nodes.length).fill(-1);
  let best = -1, bestSize = 0;
  for (let s = 0; s < nodes.length; s++) {
    if (comp[s] >= 0) continue;
    const st = [s]; comp[s] = s; let size = 0;
    while (st.length) { const u = st.pop(); size++; adj[u].forEach(k => { const v = links[k].a === u ? links[k].b : links[k].a; if (comp[v] < 0) { comp[v] = s; st.push(v); } }); }
    if (size > bestSize) { bestSize = size; best = s; }
  }
  const remap = [], keep = [];
  nodes.forEach((n, i) => { if (comp[i] === best) { remap[i] = keep.length; keep.push(n); } });
  links = links.filter(l => comp[l.a] === best).map(l => ({ ...l, a: remap[l.a], b: remap[l.b] }));
  links.forEach(l => {
    const A = keep[l.a], B = keep[l.b];
    l.len = hyp(A.x, A.y, B.x, B.y);

    l.t0 = l.len / l.vf;

    const x = 100 + i * 100, y = 100 + j * 100;
    if (nearWater(x, y, 6)) continue;
    const d = hyp(x, y, CBD.x, CBD.y);
    const noise = 0.75 + rand() * 0.5;
    const park = rand() < 0.06;
    let type, res, jobs;
    if (d < 170) { type = 'off'; res = 400; jobs = 5200; }
    else if (d < 330) { type = 'com'; res = 2200; jobs = 1900; }
    else if (x > 1000 && y > 640) { type = 'ind'; res = 100; jobs = 2300; }
    else if (park) { type = 'park'; res = 0; jobs = 60; }
    else { type = 'res'; res = 600 + 3400 * Math.exp(-d / 650); jobs = 160; }
    let node = 0, nd = Infinity;
    keep.forEach((n, k) => { const dd = hyp(n.x, n.y, x, y); if (dd < nd) { nd = dd; node = k; } });
    blocks.push({ x, y, i, j, type, res: Math.round(res * noise), jobs: Math.round(jobs * noise), node, gx: Math.floor(i / 4), gy: Math.floor(j / 3) });
  }
  // 地区名（都心を含む地区は「中央」）
  const dkeys = [...new Set(blocks.map(b => b.gx + ',' + b.gy))];
  const cb = blocks.reduce((a, b) => (hyp(b.x, b.y, CBD.x, CBD.y) < hyp(a.x, a.y, CBD.x, CBD.y) ? b : a));
  let ni = 0;
  const dname = {};
  dkeys.forEach(k => { dname[k] = k === cb.gx + ',' + cb.gy ? '中央' : DISTRICT_NAMES[ni++ % DISTRICT_NAMES.length]; });
  blocks.forEach(b => (b.district = dname[b.gx + ',' + b.gy]));

    let node = 0, nd = Infinity;
    keep.forEach((n, k) => { const dd = hyp(n.x, n.y, e.x, e.y); if (dd < nd) { nd = dd; node = k; } });
    return { ...e, node };
  });

}

      if (n < 0.5) return;
      for (let k = 0; k < K; k++) {
        const di = sample(table[oi], rand());

// 待ち客を加える。最初の一歩が「歩いて隣の停留所へ」なら、そちらで待たせる
function addWaiting(s, dest, n) {
  for (let g = 0; g < 3; g++) {
    if (s === dest) return;
    const f = TR.first[s * TR.N + dest];
    if (!f) return;
    if (f.walk === undefined) break;
    s = f.walk;
  }
  const w = S.waiting[s];
  w[dest] = (w[dest] || 0) + n;
  const over = waitTotal(s) - stopCap(s);
  if (over > 0) {
    let left = over;
    for (const k in w) { const x = Math.min(left, w[k]); w[k] -= x; left -= x; if (w[k] <= 0) delete w[k]; if (left <= 0) break; }
    S.today.lost += over;
  }
}

// ===== 車両の運行 =====
function arrive(v, L, i) {
  const c = L.stops[i], M = MODES[L.mode];
  for (const key in v.pax) {
    const [al, dest] = key.split(',').map(Number);
    if (al !== c) continue;
    const n = v.pax[key];
    delete v.pax[key];
    v.load -= n;
    if (dest !== c) addWaiting(c, dest, n);
  }
  if (i === 0) v.dir = 1;
  else if (i === L.stops.length - 1) v.dir = -1;
  v.next = i + v.dir;
  let boarded = 0;
  const w = S.waiting[c];
  for (const k in w) {
    if (v.load >= M.cap) break;
    const dest = +k, f = TR.first[c * TR.N + dest];
    if (!f || f.line !== L.id) continue;
    const ai = L.stops.indexOf(f.alight);
    if ((ai - i) * v.dir <= 0) continue;
    const n = Math.min(w[k], M.cap - v.load);
    w[k] -= n;
    if (w[k] <= 0) delete w[k];
    const key = f.alight + ',' + dest;
    v.pax[key] = (v.pax[key] || 0) + n;
    v.load += n;
    boarded += n;
  }
  if (boarded) {
    const fare = boarded * M.fare * L.fareMult;
    S.money += fare; S.today.rev += fare; S.today.rides += boarded;
    L.rides = (L.rides || 0) + boarded; L.rev = (L.rev || 0) + fare;
    if (fare >= 5e4 && FX.length < 40) FX.push({ x: S.stops[c].x, y: S.stops[c].y, text: '+' + yen(fare), life: 1 });
  }
  v.dwell = M.dwell * (0.5 + boarded / M.cap);
}
function moveVehicle(v, dt) {
  const L = lineById(v.line);
  if (!L || !L._segs.length) return;
  if (v.dwell > 0) { v.dwell -= dt; return; }
  const k = Math.min(L._segs.length - 1, v.dir > 0 ? v.next - 1 : v.next);
  const step = L._segs[Math.max(0, k)].v * dt;
  const target = L._cum[v.next];
  if (v.dir > 0) { v.pos += step; if (v.pos >= target) { v.pos = target; arrive(v, L, v.next); } }
  else { v.pos -= step; if (v.pos <= target) { v.pos = target; arrive(v, L, v.next); } }
}

// ===== 時間の進行 =====
function step(dt) {
  const ph = Math.floor(S.t / 60), pd = Math.floor(S.t / 1440);
  S.t += dt;
  const h = Math.floor(S.t / 60);
  if (h !== ph) onHour(h % 24);
  if (Math.floor(S.t / 1440) !== pd) onDay();
  spawnPassengers(dt);
  for (const v of S.vehicles) moveVehicle(v, dt);
}
function onHour(hour) {
  computeRoad();
  S.lines.forEach(lineGeom);
  computeTransit();
  hourlyTrips(hour);
}
function dailyUpkeep() {
  let c = 0;
  S.vehicles.forEach(v => { const L = lineById(v.line); if (L) c += MODES[L.mode].vehUp; });
  const used = new Set();
  S.lines.forEach(L => {
    const M = MODES[L.mode];
    L.segs.forEach((seg, k) => {
      if (M.road) { if (L.mode === 'tram') seg.links.forEach(lk => { if (!used.has('t' + lk)) { used.add('t' + lk); c += MAP.links[lk].len * M.trackUp; } }); }
      else { const key = trackKey(L.mode, L.stops[k], L.stops[k + 1]); if (!used.has(key)) { used.add(key); c += L._segs[k].len * M.trackUp; } }
    });
  });
  S.stops.forEach(s => stopModes(s).forEach(m => (c += MODES[m].stopCost * 0.001)));
  return c;
}
function onDay() {
  const D = S.today;
  D.share = D.trips ? D.transit / Math.max(1, D.transit + D.car + D.stranded) : 0;
  D.avgT = D.trips ? D.timeSum / D.trips : 0;
  D.jam = D.jamN ? Math.round(D.jamSum / D.jamN * 100) : 0;
  const up = dailyUpkeep();
  const interest = S.loan * 0.0002;
  // 市からの補助金：分担率が高く、渋滞が少ないほど多い
  const sub = 1.5e7 + D.share * 3e8 + Math.max(0, 50 - D.jam) * 1e6;
  S.money += sub - up - interest;
  D.cost += up + interest; D.sub = sub;
  // 市民の満足度：通勤時間と、移動できなかった人の割合
  const bad = (D.stranded + D.lost) / Math.max(1, D.trips);
  const target = Math.max(0, Math.min(100, 100 - Math.max(0, D.avgT - 24) * 3 - bad * 120));
  S.sat += (target - S.sat) * 0.3;
  // 満足度が高いと人が増える
  const g = (S.sat - 45) / 20000;
  S.pop.forEach(p => { p[0] *= 1 + g; p[1] *= 1 + g * 0.8; });
  S.hist.push({ day: dateStr(S.t - 1), share: D.share, avgT: D.avgT, jam: D.jam, rides: D.rides, rev: D.rev, cost: D.cost, sub: D.sub });
  if (S.hist.length > 30) S.hist.shift();
  log(`${dateStr(S.t - 1)}：利用 ${man(D.rides)}人・分担率 ${pct(D.share)}・渋滞度 ${D.jam}・収支 ${yen(D.rev + D.sub - D.cost)}`);
  S.yday = D;
  S.today = blankDay();
  S.lines.forEach(L => { L.ridesY = L.rides || 0; L.revY = L.rev || 0; L.rides = 0; L.rev = 0; });
  buildDestTables();
  checkGoals();
  if (S.money < 0) {
    S.negDays++;
    if (S.negDays >= 7) { S.over = true; showGameOver(); }
    else log(`⚠ 資金がマイナスです（${S.negDays}/7日）。7日続くと交通局は解散です。財務タブで借入できます。`);
  } else S.negDays = 0;
  save();
}
function checkGoals() {
  GOALS.forEach(g => {
    if (S.goals[g.id] || !g.test()) return;
    S.goals[g.id] = S.t;
    S.money += g.reward;
    log(`🎯 目標達成：${g.label}（市から ${yen(g.reward)}）`);
    toast(`目標達成：${g.label}　${yen(g.reward)}`);
  });
}

// ===== 建設 =====
// 停留所の名前：地区名＋丁目 → 地区名＋方角 → 地区名＋街の種類、の順に空いているものを使う
function stopName(x, y) {
  const b = MAP.blocks.reduce((a, c) => (hyp(c.x, c.y, x, y) < hyp(a.x, a.y, x, y) ? c : a));
  const used = new Set(S.stops.map(s => s.name));
  const kind = { res: ['住宅前', '団地', '小学校前'], com: ['商店街', '本通り', '市場前'], off: ['オフィス前', '市役所前', '銀行前'], ind: ['工場前', '倉庫前', '工業団地'], park: ['公園前', '公園西口', '公園東口'] }[b.type];
  const cands = [...NUMS, '北', '南', '東', '西', ...kind, '一番街', '二番街', '三番街', '橋', '交差点', '中央通り'];
  for (const n of cands) if (!used.has(b.district + n)) return b.district + n;
  let k = 2;
  while (used.has(`${b.district}第${k}`)) k++;
  return `${b.district}第${k}`;
}
function nodeStop(n) {
  const i = S.stops.findIndex(s => s.node === n && !s.removed);
  if (i >= 0) return i;
  const N = MAP.nodes[n];
  S.stops.push({ x: N.x, y: N.y, node: n, name: stopName(N.x, N.y), modes: {}, planned: true });
  S.waiting.push({});
  return S.stops.length - 1;
}
function startBuild(mode, lineId) {
  tool = null;
  const L = lineId ? lineById(lineId) : null;
  draft = {
    mode, lineId: lineId || null,
    stops: L ? L.stops.slice() : [], segs: L ? L.segs.map(s => ({ ...s, keep: true })) : [],
    vias: [], pending: [], undo: [], planned: [], prepend: false, via: false, added: 0,
  };
  renderBuildBar();
  if (window.innerWidth < 900) $('#panel').classList.add('collapsed');
  toast(L ? '延伸先をタップしてください' : MODES[mode].road ? '始点の交差点をタップしてください' : '駅を置く場所をタップしてください');
}
// 作図中の区間の形を計算する（道路系は交差点の経路、それ以外は折れ線）
function draftSeg(a, b, vias) {
  const M = MODES[draft.mode];
  if (M.road) {
    const pts = [S.stops[a].node, ...vias.map(v => v.node), S.stops[b].node];
    const nodes = [pts[0]], links = [];
    for (let i = 1; i < pts.length; i++) {
      const r = shortestByLength(pts[i - 1], pts[i]);
      if (!r) return null;
      links.push(...r.links); nodes.push(...r.nodes.slice(1));
    }
    return { nodes, links, vias: vias.map(v => v.node) };
  }
  return { pts: vias.map(v => ({ x: v.x, y: v.y })) };
}
function segInfo(mode, a, b, seg) {
  const M = MODES[mode];
  if (M.road) {
    let cost = 0, len = 0;
    seg.links.forEach(k => { len += MAP.links[k].len; if (mode === 'tram' && !S.tram[k]) cost += MAP.links[k].len * M.segCost; });
    return { cost, len, ok: true };
  }
  if (S.tracks[trackKey(mode, a, b)]) return { cost: 0, len: 0, ok: true, reuse: true };
  const pts = [S.stops[a], ...seg.pts, S.stops[b]].map(p => ({ x: p.x, y: p.y }));
  const wf = waterFraction(pts, mode === 'ferry' ? 30 : 0);
  if (mode === 'ferry') return { cost: 0, len: wf.len, ok: wf.water > 0.97, msg: '水上バスの航路が陸地を通っています' };
  const mult = mode === 'rail' ? 4 : 1.5;   // 鉄道は橋、地下鉄は川底トンネル
  return { cost: (wf.len - wf.waterLen) * M.segCost + wf.waterLen * M.segCost * mult, len: wf.len, ok: true, water: wf.waterLen };

function draftInfo() {
  const M = MODES[draft.mode];
  const r = { cost: 0, len: 0, ok: true, msg: '' };
  draft.stops.forEach(s => { if (!S.stops[s].modes[draft.mode]) r.cost += M.stopCost; });
  for (let k = 1; k < draft.stops.length; k++) {
    const seg = draft.segs[k - 1];
    if (!seg) { r.ok = false; r.msg = '道路がつながっていません'; continue; }
    if (seg.keep) continue;
    const si = segInfo(draft.mode, draft.stops[k - 1], draft.stops[k], seg);
    r.cost += si.cost; r.len += si.len;
    if (!si.ok) { r.ok = false; r.msg = si.msg; }

function draftAddStop(s) {

  const wps = draft.pending;
  const end = draft.prepend ? draft.stops[0] : draft.stops[draft.stops.length - 1];
  if (draft.stops.length) {
    const seg = draft.prepend ? draftSeg(s, end, wps.slice().reverse()) : draftSeg(end, s, wps);
    if (!seg) { toast('道路がつながっていません'); return false; }
    if (draft.prepend) { draft.stops.unshift(s); draft.segs.unshift(seg); }
    else { draft.stops.push(s); draft.segs.push(seg); }

function draftTap(sx, sy) {
  const p = toWorld(sx, sy);

  if (M.road) {
    const n = nearestNode(p, 28 / view.s);
    if (n < 0) { toast('交差点の近くをタップしてください'); return; }
    if (draft.via) {
      if (!draft.stops.length) { toast('先に始点の停留所をタップしてください'); return; }
      draft.pending.push({ node: n, x: MAP.nodes[n].x, y: MAP.nodes[n].y });
      draft.undo.push({ via: true });
      renderBuildBar();

    }
    const before = S.stops.length;
    const s = nodeStop(n);
    if (S.stops.length > before) draft.planned.push(s);
    if (!draftAddStop(s) && S.stops.length > before) dropPlanned(s);

  // 地下鉄・鉄道・水上バス
  const near = nearestStop(p, 22 / view.s, i => S.stops[i].node === undefined);
  if (draft.via) {
    if (!draft.stops.length) { toast('先に始点の駅をタップしてください'); return; }
    draft.pending.push({ x: Math.round(p.x), y: Math.round(p.y) });
    draft.undo.push({ via: true });

  if (near >= 0) { draftAddStop(near); return; }
  if (isWater(p.x, p.y)) { toast('水の上には駅を置けません'); return; }
  if (draft.mode === 'ferry' && !nearWater(p.x, p.y, 25)) { toast('水上バスの乗り場は岸辺に置いてください'); return; }
  if (S.stops.some(s => !s.removed && hyp(s.x, s.y, p.x, p.y) < 20)) { toast('ほかの駅に近すぎます'); return; }
  S.stops.push({ x: Math.round(p.x), y: Math.round(p.y), name: stopName(p.x, p.y), modes: {}, planned: true });

function dropPlanned(s) {

  S.stops.pop(); S.waiting.pop();

function draftUndo() {
  const u = draft.undo.pop();
  if (!u) return;
  if (u.via) draft.pending.pop();
  else {
    const s = draft.prepend ? draft.stops.shift() : draft.stops.pop();
    if (draft.stops.length) draft.prepend ? draft.segs.shift() : draft.segs.pop();

    draft.added--;

function commitBuild() {
  const info = draftInfo();
  if (!info.ok || draft.pending.length || info.cost > S.money) return;
  const M = MODES[draft.mode];
  S.money -= info.cost; S.today.cost += info.cost;
  draft.segs.forEach((seg, k) => {
    if (seg.keep) return;
    if (M.road) { if (draft.mode === 'tram') seg.links.forEach(lk => (S.tram[lk] = true)); }
    else {
      const a = draft.stops[k], b = draft.stops[k + 1], key = trackKey(draft.mode, a, b);
      if (!S.tracks[key]) S.tracks[key] = { pts: a < b ? seg.pts : seg.pts.slice().reverse() };
    }

  const segs = draft.segs.map(s => (M.road ? { nodes: s.nodes, links: s.links } : {}));
  draft.stops.forEach(s => { const st = S.stops[s]; st.modes[draft.mode] = true; delete st.planned; });
  if (draft.lineId) {
    const L = lineById(draft.lineId);
    const front = draft.prepend ? draft.stops.length - L.stops.length : 0;
    L.stops = draft.stops.slice(); L.segs = segs;
    lineGeom(L);
    if (front) S.vehicles.filter(v => v.line === L.id).forEach(v => { v.next += front; v.pos += L._cum[front]; });
    log(`${L.code} ${L.name}を延伸しました（${yen(info.cost)}）。`);

    const n = S.lines.filter(l => l.mode === draft.mode).length + 1;
    const used = new Set(S.lines.map(l => l.color));

      color: LINE_COLORS.find(c => !used.has(c)) || LINE_COLORS[S.lines.length % LINE_COLORS.length],

  $('#panel').classList.remove('collapsed');
  rebuildNet();

  syncTabs();
}
function addVehicle(L) {
  const M = MODES[L.mode];

  S.money -= M.vehCost; S.today.cost += M.vehCost;
  const n = S.vehicles.filter(v => v.line === L.id).length;
  S.vehicles.push({ id: S.nextId++, line: L.id, pos: 0, dir: 1, next: 0, dwell: (L._rt || 10) / (n + 1) / 2, load: 0, pax: {} });

function sellVehicle(L) {

  const v = list.reduce((a, b) => (a.load <= b.load ? a : b));

  S.money += back;

}

    case 'stopLine': selLine = +b.dataset.line; tab = 'lines'; syncTabs(); return;
    case 'borrow': S.loan += 1e9; S.money += 1e9; log('銀行から10億円を借り入れました（日利0.02%）。'); break;

function drawChart(id, vals, color, fmt) {
  const c = document.getElementById(id);
  if (!c) return;
  const r = c.getBoundingClientRect();
  c.width = r.width * dpr; c.height = r.height * dpr;
  const g = c.getContext('2d');
  g.scale(dpr, dpr);
  g.font = `10px ${getComputedStyle(document.body).fontFamily}`;
  if (vals.length < 2) { g.fillStyle = COL.muted; g.fillText('1日たつと記録が始まります', 4, 20); return; }
  const max = Math.max(1, ...vals) * 1.1, top = 10, bot = r.height - 14;
  g.strokeStyle = COL.rule; g.beginPath(); g.moveTo(0, bot + 0.5); g.lineTo(r.width, bot + 0.5); g.stroke();
  g.beginPath();
  vals.forEach((v, i) => { const x = 4 + i / (vals.length - 1) * (r.width - 40), y = bot - v / max * (bot - top); i ? g.lineTo(x, y) : g.moveTo(x, y); });
  g.strokeStyle = color; g.lineWidth = 2; g.stroke();
  const lx = 4 + (r.width - 40), ly = bot - vals[vals.length - 1] / max * (bot - top);
  g.fillStyle = color; g.beginPath(); g.arc(lx, ly, 3, 0, 7); g.fill();
  g.fillStyle = COL.muted; g.textAlign = 'left'; g.fillText(fmt(vals[vals.length - 1]), lx + 6, ly + 3);
  g.fillText(`${vals.length}日前`, 4, r.height - 2);
}
function drawMoneyChart() {
  const c = document.getElementById('chartMoney');
  if (!c) return;
  const r = c.getBoundingClientRect();
  c.width = r.width * dpr; c.height = r.height * dpr;
  const g = c.getContext('2d');
  g.scale(dpr, dpr);
  g.font = `10px ${getComputedStyle(document.body).fontFamily}`;
  const data = S.hist.slice(-14);
  if (!data.length) { g.fillStyle = COL.muted; g.fillText('1日たつと記録が始まります', 4, 20); return; }
  const max = Math.max(1, ...data.map(d => Math.max(d.rev + d.sub, d.cost)));
  const bw = r.width / Math.max(7, data.length), bot = r.height - 14;
  data.forEach((d, i) => {
    const x = i * bw + bw * 0.15, w = bw * 0.33;
    const h1 = (d.rev + d.sub) / max * (bot - 6), h2 = d.cost / max * (bot - 6);
    g.fillStyle = COL.good; g.fillRect(x, bot - h1, w, h1);
    g.fillStyle = COL.bad; g.fillRect(x + w + 2, bot - h2, w, h2);
  });
  g.fillStyle = COL.muted; g.textAlign = 'right'; g.fillText(yen(max), r.width - 2, 10);
  g.textAlign = 'left'; g.fillText(`直近${data.length}日`, 2, r.height - 2);
}

  speed = 0; syncSpeed();
  overlay(`<h2>交通局は解散しました</h2><p>資金不足が7日続きました。</p>
    <dl class="kv"><dt>期間</dt><dd>${dateStr(0)} 〜 ${dateStr(S.t)}</dd><dt>最後の分担率</dt><dd>${pct(S.yday.share)}</dd></dl>
    <button class="btn primary" data-act="reset">最初からやり直す</button>`);
  pendingConfirm = 'reset';
}

// ===== 保存 =====
function save() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(S, (k, v) => (k.startsWith('_') ? undefined : v)));
  } catch (e) { /* 保存できない環境では何もしない */ }
}
function load() {
  try { const o = JSON.parse(localStorage.getItem(SAVE_KEY)); return o && o.v === 1 ? o : null; } catch (e) { return null; }
}

// ===== 起動 =====
function initGame() {
  selLine = null; sel = null; draft = null; tool = null; FX = []; flowAcc = new Map();
  applyLanes();
  buildBase();
  buildDestTables();
  computeRoad();
  rebuildNet();
  computeLanes();
  hourlyTrips(Math.floor(S.t / 60) % 24);
  tab = 'lines';
  $('#panel').classList.remove('collapsed');
  fitView(); renderBuildBar(); syncSpeed(); syncLayers(); syncTabs();
}
function warmUp() {
  // 最初の交通量を落ち着かせるため、朝のラッシュまでを数回まわしておく
  for (let r = 0; r < 3; r++) for (let h = 5; h <= 8; h++) { computeRoad(); hourlyTrips(h); }
  S.today = blankDay();
  computeRoad();
}
function newRun() {
  S = newGame();
  speed = 1;
  initGame();
  warmUp();
  log('みなと市交通局が発足しました。');
  save();
  showHelp();
}
let looping = false;
function start(data) {
  MAP = genMap();
  readColors();
  resize();
  const hot = data && data.state;
  S = (hot && hot.v === 1 ? hot : null) || load();
  if (!S) { newRun(); }
  else { initGame(); if (!hot) showHelp(); }
  if (!looping) { looping = true; requestAnimationFrame(frame); }
}
let last = performance.now(), panelTimer = 0, simAcc = 0;
function frame(now) {
  const real = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (!S.over && speed > 0 && $('#overlay').hidden) {
    simAcc += real * speed * 60 / REAL_SEC_PER_HOUR;
    let guard = 0;
    while (simAcc >= 0.5 && guard++ < 200) { step(0.5); simAcc -= 0.5; }
    animT += real * speed;
  }
  FX.forEach(f => (f.life -= real * 0.8));
  FX = FX.filter(f => f.life > 0);
  computeLanes();
  draw();
  updateHud();
  panelTimer += real;
  const a = document.activeElement;
  if ((dirtyPanel || panelTimer > 1) && !(a && a.tagName === 'INPUT')) { panelTimer = 0; renderPanel(); if (draft) renderBuildBar(); }
  requestAnimationFrame(frame);
}
new ResizeObserver(() => {
  if (!S) return;
  const ow = CW, oh = CH;
  const wasFit = Math.abs(view.s - Math.min(ow / (W + 20), oh / (H + 20))) < 1e-6;
  resize();
  if (wasFit) fitView(); else { view.x += (CW - ow) / 2; view.y += (CH - oh) / 2; }
}).observe($('#mapWrap'));
window.addEventListener('pagehide', save);
window.claude?.hot?.snapshot?.(() => ({ state: JSON.parse(JSON.stringify(S, (k, v) => (k.startsWith('_') ? undefined : v))) }));
const boot = data => start(data || {});
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
</body>
