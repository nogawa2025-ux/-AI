<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>みなと交通指令所</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 運行指令所の制御盤。上に計器帯、中央に路線図ボード、下（広い画面では右）に操作パネル */
:root {
  --bg: #0b1220;
  --board: #111b2c;
  --panel: #131e30;
  --rule: #24344f;
  --fg: #e4ebf5;
  --muted: #8796ae;
  --led: #ffb547;
  --good: #4fd18b;
  --bad: #ff6262;
  --land: #15213a;
  --land-2: #182641;
  --sea: #08111f;
  --river: #1d3658;
  --grid: rgba(120, 150, 200, 0.06);
  --font-led: "DotGothic16", "Osaka-Mono", "MS Gothic", monospace;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 14px;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
}
#app {
  height: 100%;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "hud" "map" "panel";
}
@media (min-width: 900px) {
  #app {
    grid-template-columns: minmax(0, 1fr) 380px;
    grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas: "hud hud" "map panel";
  }
}

/* 計器帯 */
#hud {
  grid-area: hud;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 18px;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--panel);
  border-bottom: 1px solid var(--rule);
}
.brand {
  font-family: var(--font-led);
  font-size: 18px;
  letter-spacing: 0.08em;
  color: var(--led);
  margin-right: auto;
}
.brand small { color: var(--muted); font-size: 11px; margin-left: 6px; letter-spacing: 0.15em; }
.meter { display: flex; flex-direction: column; line-height: 1.15; }
.meter .lbl { font-size: 10px; color: var(--muted); letter-spacing: 0.15em; }
.meter .val {
  font-family: var(--font-led);
  font-size: 17px;
  color: var(--led);
  font-variant-numeric: tabular-nums;
  text-shadow: 0 0 8px rgba(255, 181, 71, 0.35);
}
.meter .val.neg { color: var(--bad); text-shadow: 0 0 8px rgba(255, 98, 98, 0.4); }
.speed { display: flex; gap: 4px; }
.speed button {
  font-family: var(--font-led);
  min-width: 38px;
  padding: 5px 6px;
  border-radius: 4px;
  border: 1px solid var(--rule);
  background: var(--board);
  color: var(--muted);
  cursor: pointer;
}
.speed button.on { color: var(--bg); background: var(--led); border-color: var(--led); }

/* 路線図ボード */
#mapWrap { grid-area: map; position: relative; overflow: hidden; background: var(--sea); touch-action: none; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
.zoom {
  position: absolute;
  right: max(10px, env(safe-area-inset-right, 0px));
  bottom: 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.zoom button {
  width: 36px; height: 36px;
  border-radius: 6px;
  border: 1px solid var(--rule);
  background: rgba(17, 27, 44, 0.92);
  color: var(--fg);
  font-size: 16px;
  cursor: pointer;
}
#buildBar {
  position: absolute;
  top: 10px;
  left: max(10px, env(safe-area-inset-left, 0px));
  right: max(10px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  padding: 10px 12px;
  background: rgba(17, 27, 44, 0.95);
  border: 1px solid var(--led);
  border-radius: 8px;
}
@media (max-width: 899px) {
  #buildBar { top: auto; bottom: 10px; right: calc(max(10px, env(safe-area-inset-right, 0px)) + 46px); }
}
#buildBar .info { flex: 1 1 220px; min-width: 0; font-size: 13px; line-height: 1.5; }
#buildBar .info b { color: var(--led); font-family: var(--font-led); font-weight: 400; }
#buildBar .route { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
#toast {
  position: absolute;
  left: 50%;
  top: 12px;
  transform: translateX(-50%);
  max-width: calc(100% - 80px);
  padding: 8px 14px;
  border-radius: 6px;
  background: rgba(10, 16, 28, 0.94);
  border: 1px solid var(--rule);
  font-size: 13px;
  pointer-events: none;
  transition: opacity 0.3s;
}

/* 操作パネル */
#panel {
  grid-area: panel;
  display: flex;
  flex-direction: column;
  min-height: 0;
  max-height: 42vh;
  background: var(--panel);
  border-top: 1px solid var(--rule);
}
@media (min-width: 900px) {
  #panel { max-height: none; border-top: 0; border-left: 1px solid var(--rule); }
}
#tabs {
  display: flex;
  overflow-x: auto;
  border-bottom: 1px solid var(--rule);
  padding-left: max(8px, env(safe-area-inset-left, 0px));
  padding-right: max(8px, env(safe-area-inset-right, 0px));
}
#tabs button {
  flex: 1 0 auto;
  padding: 10px 12px;
  background: none;
  border: 0;
  border-bottom: 2px solid transparent;
  color: var(--muted);
  font: inherit;
  font-size: 13px;
  cursor: pointer;
}
#tabs button.on { color: var(--fg); border-bottom-color: var(--led); }
#panel.collapsed #panelBody { display: none; }
#panel.collapsed #tabs button.on { border-bottom-color: transparent; }
#panelBody {
  overflow-y: auto;
  padding-block: 12px 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 12px;
}
h3 { margin: 0; font-size: 15px; text-wrap: balance; }
.hint { color: var(--muted); font-size: 12px; line-height: 1.6; margin: 0; }
.btn {
  font: inherit;
  font-size: 13px;
  padding: 7px 12px;
  border-radius: 6px;
  border: 1px solid var(--rule);
  background: var(--board);
  color: var(--fg);
  cursor: pointer;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--led); color: var(--bg); border-color: var(--led); font-weight: 700; }
.btn.danger { color: var(--bad); border-color: rgba(255, 98, 98, 0.5); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--led); outline-offset: 2px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.badge {
  display: inline-grid;
  place-items: center;
  min-width: 30px;
  height: 22px;
  padding: 0 4px;
  border-radius: 11px;
  border: 3px solid var(--c);
  background: var(--fg);
  color: #0b1220;
  font-family: var(--font-led);
  font-size: 12px;
  box-sizing: border-box;
}
.lineItem {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  padding: 8px 10px;
  border: 1px solid var(--rule);
  border-radius: 6px;
  background: var(--board);
  cursor: pointer;
  color: inherit;
  font: inherit;
  text-align: left;
  width: 100%;
}
.lineItem .nm { font-weight: 500; overflow-wrap: anywhere; }
.lineItem .sub { color: var(--muted); font-size: 12px; }
.num { font-family: var(--font-led); font-variant-numeric: tabular-nums; }
.pos { color: var(--good); }
.neg { color: var(--bad); }
dl.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; margin: 0; font-size: 13px; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; overflow-wrap: anywhere; }
.types { display: grid; gap: 8px; }
.typeCard {
  display: grid;
  gap: 4px;
  padding: 10px 12px;
  border: 1px solid var(--rule);
  border-radius: 6px;
  background: var(--board);
}
.typeCard .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.typeCard .spec { color: var(--muted); font-size: 12px; line-height: 1.6; }
input[type=range] { width: 100%; accent-color: var(--led); }
.bars { display: grid; gap: 3px; }
.bar { height: 6px; border-radius: 3px; background: var(--rule); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--led); }
.logList { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 12px; line-height: 1.5; }
.logList li { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 8px; }
.logList .d { color: var(--muted); font-family: var(--font-led); }
.ach { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.ach div { padding: 6px 8px; border: 1px dashed var(--rule); border-radius: 6px; font-size: 12px; color: var(--muted); }
.ach div.got { border-style: solid; border-color: var(--led); color: var(--fg); }
#finChart { width: 100%; height: 130px; display: block; }
.cityRow {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto auto;
  gap: 10px;
  align-items: center;
  padding: 7px 10px;
  border: 1px solid var(--rule);
  border-radius: 6px;
  background: var(--board);
  color: inherit;
  font: inherit;
  text-align: left;
  width: 100%;
  cursor: pointer;
}
.cityRow .nm { font-weight: 500; }
.cityRow .sub { color: var(--muted); font-size: 11px; }
.cityRow .st { font-size: 11px; color: var(--muted); min-width: 2.5em; text-align: right; }
.cityRow .st.on { color: var(--led); }
.list { display: grid; gap: 6px; }
.kana { color: var(--muted); font-size: 11px; font-weight: 400; letter-spacing: 0.08em; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 10px; border: 1px solid var(--rule); font-size: 11px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.desc { margin: 0; font-size: 13px; line-height: 1.7; }
.spark { width: 100%; height: 48px; display: block; }
.goal { display: grid; gap: 4px; padding: 8px 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--board); }
.goal.done { border-color: var(--good); }
.goal .top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.goal.done .bar > i { background: var(--good); }
.scList { display: grid; gap: 8px; }
.sc { display: grid; gap: 6px; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--board); }
.sc .top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
.sc .lv { font-family: var(--font-led); color: var(--muted); font-size: 12px; letter-spacing: 0.1em; }
.stars { color: var(--led); font-size: 13px; letter-spacing: 0.1em; }
.sc .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

#overlay {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  background: rgba(5, 9, 16, 0.78);
  z-index: 20;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#overlay .card {
  max-width: 480px;
  max-height: 85vh;
  overflow-y: auto;
  background: var(--panel);
  border: 1px solid var(--rule);
  border-radius: 10px;
  padding: 20px 22px;
  display: grid;
  gap: 12px;
  line-height: 1.7;
}
#overlay h2 { margin: 0; font-family: var(--font-led); font-weight: 400; color: var(--led); font-size: 22px; letter-spacing: 0.06em; }
#overlay ol { margin: 0; padding-left: 1.3em; font-size: 13px; }
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="brand">みなと交通<small>運行指令所</small></div>
    <div class="meter"><span class="lbl">資金</span><span class="val" id="hMoney">—</span></div>
    <div class="meter"><span class="lbl">日時</span><span class="val" id="hDate">—</span></div>
    <div class="meter"><span class="lbl">評判</span><span class="val" id="hRep">—</span></div>
    <div class="meter" id="mLeft" hidden><span class="lbl">期限まで</span><span class="val" id="hLeft">—</span></div>
    <div class="speed" id="speedBtns">
      <button data-speed="0" aria-label="一時停止">II</button>
      <button data-speed="1" aria-label="等速">1×</button>
      <button data-speed="2" aria-label="2倍速">2×</button>
      <button data-speed="4" aria-label="4倍速">4×</button>
    </div>
  </header>
  <main id="mapWrap">
    <canvas id="map"></canvas>
    <div id="buildBar" hidden></div>
    <div class="zoom">
      <button id="zIn" aria-label="拡大">＋</button>
      <button id="zOut" aria-label="縮小">−</button>
      <button id="zFit" aria-label="全体表示">⤢</button>
    </div>
    <div id="toast" style="opacity:0"></div>
  </main>
  <aside id="panel">
    <nav id="tabs">
      <button data-tab="lines">路線</button>
      <button data-tab="build">建設</button>
      <button data-tab="station">都市</button>
      <button data-tab="goal">目標</button>
      <button data-tab="finance">財務</button>
      <button data-tab="log">記録</button>
    </nav>
    <div id="panelBody"></div>
  </aside>
</div>
<div id="overlay" hidden></div>

<script>
'use strict';
// ===== 基本データ =====
const W = 1000, H = 700;
const HOUR_SEC = 0.25;          // 等速時、ゲーム内1時間 = 0.25秒
const K_DEMAND = 3;
const BASE_DATE = Date.UTC(2026, 3, 1);
const SAVE_KEY = 'minato-transit-v2';
const CLEAR_KEY = 'minato-transit-clears';

const TYPES = {
  bus:  { key: 'bus',  name: 'バス',   code: 'B', speed: 35,  cap: 40,  unit: 4e4,   st: 2e6, veh: 1.5e7, vehUp: 1.2e6, trackUp: 1500,  fare: 5,  w: 3, unitName: '台' },
  rail: { key: 'rail', name: '鉄道',   code: 'R', speed: 60,  cap: 300, unit: 5e5,   st: 2e7, veh: 8e7,   vehUp: 5e6,   trackUp: 15000, fare: 5,  w: 5, unitName: '編成' },
  hsr:  { key: 'hsr',  name: '新幹線', code: 'S', speed: 160, cap: 800, unit: 2.5e6, st: 8e7, veh: 3e8,   vehUp: 1.8e7, trackUp: 60000, fare: 10, w: 6, unitName: '編成' },

const HSR_MIN_SIZE = 250;

const CITY_DEFS = [
  { name: 'みなと中央', kana: 'みなとちゅうおう', kind: '中核市', x: 500, y: 360, pop: 900, jobs: 900, tour: 30, growth: 0.001, tag: 'center',
    desc: '県庁と大企業の本社が集まる地域の中心。平日の昼は周りの街から通勤客が押し寄せる。', spots: ['県庁', 'みなと中央商店街', '中央公園'] },

  { name: '北山', kana: 'きたやま', kind: '町', x: 470, y: 80, pop: 140, jobs: 50, tour: 10, growth: -0.001, tag: '',

  { name: '海浜公園', kana: 'かいひんこうえん', kind: '行楽地', x: 905, y: 330, pop: 10, jobs: 15, tour: 70, growth: 0, tag: 'resort',

    desc: '酪農の村。牧場のソフトクリームが名物。', spots: ['まきの牧場'] },

    desc: 'IT企業の研究所が集まる業務団地。平日の朝夕だけ人が動く。', spots: ['みなとテクノタワー'] },

const TAG_LABEL = {
  center: '都心（平日は通勤客が集中）', port: '港町', airport: '空港（旅行者が一日中利用）', onsen: '温泉地（週末に観光客）',
  univ: '学生街（平日に混雑、休日は閑散）', industry: '工業地帯（平日の朝夕に通勤）', office: '業務地区（平日のみ）', resort: '行楽地（週末に大混雑）',
};
const LINE_COLORS = ['#e8423f', '#2f8fe0', '#f5a524', '#3cb371', '#a066d3', '#e86fa8', '#14b8c4', '#c9a227', '#8bc34a', '#ff7f50', '#5c7cfa', '#d9480f'];
// 時間帯ごとの需要（朝夕ラッシュ）。平均1に正規化
const HOURF = (() => {
  const raw = [0.1, 0.05, 0.05, 0.05, 0.1, 0.3, 0.9, 2.0, 2.2, 1.3, 0.9, 0.9, 1.0, 0.9, 0.9, 1.0, 1.3, 1.9, 2.0, 1.4, 1.0, 0.7, 0.4, 0.2];
  const m = raw.reduce((a, b) => a + b, 0) / 24;
  return raw.map(v => v / m);
})();
// 観光客の動き（昼間に多い）。平均1に正規化
const TOURF = (() => {
  const raw = [0.05, 0.02, 0.02, 0.02, 0.05, 0.2, 0.5, 0.9, 1.4, 1.8, 2.0, 1.8, 1.5, 1.6, 1.8, 1.9, 1.7, 1.4, 1.1, 0.8, 0.5, 0.3, 0.15, 0.08];
  const m = raw.reduce((a, b) => a + b, 0) / 24;
  return raw.map(v => v / m);
})();
const SEA = [[1000, 330], [960, 360], [905, 430], [872, 500], [850, 560], [800, 640], [760, 700], [1000, 700]];

const ACHIEVEMENTS = [
  ['firstLine', '初めての路線を開業'],
  ['profit', '月次決算で黒字'],
  ['pax10k', '累計乗客 1万人'],
  ['pax1m', '累計乗客 100万人'],
  ['hsr', '新幹線を開業'],
  ['net1b', '純資産 10億円'],
  ['net10b', '純資産 100億円'],
  ['rep90', '評判 90 に到達'],
  ['allCities', '全都市に駅を設置'],
];

// ===== 状態 =====
let S;            // 保存対象のゲーム状態
let R = [];       // 経路表 R[s][d] = {line, alight, hours, fm}
let ACC = [];     // 需要の端数
let segLines = {};
let view = { x: 0, y: 0, s: 1 };
let speed = 1;
let tab = 'lines';
let selLine = null, selCity = null;
let draft = null;
let pendingConfirm = null;
let FX = [];
let dirtyPanel = true;

function newGame() {
  return {
    v: 2, money: 5e8, loan: 0, t: 7, rep: 50, scenario: null, goalDone: [], endMonth: 0, result: null,
    cities: CITY_DEFS.map(c => ({ ...c, spots: c.spots.slice(), hist: [c.pop], users: 0, usersPrev: 0, arr: 0, arrPrev: 0 })),
    lines: [], trains: [],
    waiting: CITY_DEFS.map(() => ({})),
    built: { seg: {}, st: {} },
    month: { rev: 0, cost: 0, pax: 0 },
    day: { del: 0, lost: 0 },
    hist: [], totalPax: 0, effects: [], log: [], ach: {},
    nextId: 1, nextEventDay: 10, negMonths: 0, over: false,
  };
}

// ===== ユーティリティ =====
const $ = s => document.querySelector(s);
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const lineById = id => S.lines.find(l => l.id === id);
const segKey = (a, b) => a < b ? a + '-' + b : b + '-' + a;
function yen(v) {
  const s = v < 0 ? '-' : '';
  const a = Math.abs(v);
  if (a >= 1e8) return s + '¥' + (a / 1e8).toFixed(a >= 1e10 ? 0 : a >= 1e9 ? 1 : 2) + '億';
  if (a >= 1e4) return s + '¥' + Math.round(a / 1e4).toLocaleString() + '万';
  return s + '¥' + Math.round(a).toLocaleString();
}
const dateAt = t => new Date(BASE_DATE + t * 3600e3);
const monthOf = t => { const d = dateAt(t); return d.getUTCFullYear() * 12 + d.getUTCMonth(); };
function dateStr(t, withTime) {
  const d = dateAt(t);
  const s = `${d.getUTCFullYear()}/${d.getUTCMonth() + 1}/${d.getUTCDate()}`;
  if (!withTime) return s;
  return s + ' ' + String(d.getUTCHours()).padStart(2, '0') + ':' + String(Math.floor(d.getUTCMinutes() / 10) * 10).padStart(2, '0');
}
function log(msg) {
  S.log.unshift({ t: S.t, msg });
  if (S.log.length > 60) S.log.length = 60;
  dirtyPanel = true;
}
let toastTimer;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg;
  el.style.opacity = 1;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (el.style.opacity = 0), 2600);
}
function effActive(kind, city) {
  return S.effects.find(e => e.kind === kind && (city === undefined || e.city === city));
}
const speedF = () => effActive('storm') ? 0.5 : 1;
const costF = () => effActive('fuel') ? 1.4 : 1;

// ===== 路線網の再計算 =====
function lineGeom(L) {
  const cum = [0];
  for (let i = 1; i < L.path.length; i++) cum.push(cum[i - 1] + dist(S.cities[L.path[i - 1]], S.cities[L.path[i]]));
  L._cum = cum;
  L._len = cum[cum.length - 1];
}
function servedSet() {
  const s = new Set();
  S.lines.forEach(L => L.path.forEach(c => s.add(c)));
  return s;
}
function rebuild() {
  const N = S.cities.length;
  S.lines.forEach(lineGeom);
  segLines = {};
  S.lines.forEach(L => {
    for (let i = 1; i < L.path.length; i++) {
      const k = segKey(L.path[i - 1], L.path[i]);
      (segLines[k] = segLines[k] || []).push(L.id);
    }
  });
  // 線路維持費（使用中の区間のみ）
  const used = {};
  S.lines.forEach(L => {
    for (let i = 1; i < L.path.length; i++) used[L.type + ':' + segKey(L.path[i - 1], L.path[i])] = TYPES[L.type].trackUp * (L._cum[i] - L._cum[i - 1]);
  });
  S._trackUp = Object.values(used).reduce((a, b) => a + b, 0);

  // 経路表：車両のいる路線だけで最短時間経路を探す
  const adj = Array.from({ length: N }, () => []);
  S.lines.forEach(L => {
    if (!S.trains.some(t => t.line === L.id)) return;
    const T = TYPES[L.type];
    for (let i = 0; i < L.path.length; i++)
      for (let j = 0; j < L.path.length; j++) {
        if (i === j) continue;
        const h = Math.abs(L._cum[j] - L._cum[i]) / T.speed + 0.5;
        adj[L.path[i]].push({ to: L.path[j], h, line: L.id, fm: L.fareMult });
      }
  });
  R = [];
  for (let s = 0; s < N; s++) {
    const d = new Array(N).fill(Infinity), first = new Array(N).fill(null), fmAcc = new Array(N).fill(0), done = new Array(N).fill(false);
    d[s] = 0;
    for (;;) {
      let u = -1;
      for (let i = 0; i < N; i++) if (!done[i] && d[i] < Infinity && (u < 0 || d[i] < d[u])) u = i;
      if (u < 0) break;
      done[u] = true;
      for (const e of adj[u]) {
        const nd = d[u] + e.h + (u === s ? 0 : 0.3);
        if (nd < d[e.to]) {
          d[e.to] = nd;
          first[e.to] = u === s ? { line: e.line, alight: e.to } : first[u];
          fmAcc[e.to] = fmAcc[u] + e.fm * e.h;
        }
      }
    }
    R[s] = [];
    for (let t = 0; t < N; t++) R[s][t] = (t !== s && first[t]) ? { ...first[t], hours: d[t], fm: fmAcc[t] / d[t] } : null;
  }
  if (ACC.length !== N * N) ACC = new Array(N * N).fill(0);
  // 行き先に行けなくなった待ち客は帰宅
  S.waiting.forEach((w, s) => { for (const k in w) if (!R[s][k]) delete w[k]; });
  dirtyPanel = true;
}

// ===== シミュレーション =====
// 通勤・通学の曜日と時間帯による増減
function commuteF(c, weekend, hour) {
  switch (c.tag) {
    case 'univ': return weekend ? 0.35 : 1.3;
    case 'industry': return weekend ? 0.3 : ((hour >= 6 && hour <= 9) || (hour >= 17 && hour <= 20) ? 1.5 : 1);
    case 'office': return weekend ? 0.2 : 1.3;
    default: return weekend ? 0.55 : 1;
  }
}
// 駅のホームに入りきる人数
function waitCap(c) { const x = S.cities[c]; return Math.round(200 + x.pop + x.jobs * 0.5 + x.tour * 2); }
function waitTotal(c) { let n = 0; for (const k in S.waiting[c]) n += S.waiting[c][k]; return n; }

function genDemand(dt) {
  const d = dateAt(S.t);
  const hour = d.getUTCHours();
  const weekend = d.getUTCDay() === 0 || d.getUTCDay() === 6;
  const base = K_DEMAND * (0.5 + S.rep / 100) * dt / 24;
  const tourF = TOURF[hour] * (weekend ? 1.8 : 0.7);
  const N = S.cities.length;
  for (let s = 0; s < N; s++) {
    const row = R[s];
    if (!row) continue;
    let any = false;
    const cs = S.cities[s];
    const cfs = commuteF(cs, weekend, hour);
    const fs = effActive('fest', s) ? 2.5 : 1;
    for (let t = 0; t < N; t++) {
      const r = row[t];
      if (!r) continue;
      any = true;
      const ct = S.cities[t];
      // 住む人→働く場所への通勤と、観光地へ向かう旅行客
      const commute = (cs.pop * ct.jobs + cs.jobs * ct.pop) / 2000 * HOURF[hour] * cfs * commuteF(ct, weekend, hour);
      const tour = (cs.pop * ct.tour + cs.tour * ct.pop) / 1000 * tourF;
      const D = base * (commute + tour) / (1 + r.hours / 5) * Math.pow(r.fm, -1.3) * fs * (effActive('fest', t) ? 2.5 : 1);
      const i = s * N + t;
      ACC[i] += D;
      if (ACC[i] >= 1) {
        const n = Math.floor(ACC[i]);
        ACC[i] -= n;
        S.waiting[s][t] = (S.waiting[s][t] || 0) + n;
      }
    }
    if (!any) continue;
    // ホームからあふれた客は諦めて帰る
    let over = waitTotal(s) - waitCap(s);
    while (over > 0) {
      let bk = null;
      for (const k in S.waiting[s]) if (bk === null || S.waiting[s][k] > S.waiting[s][bk]) bk = k;
      const n = Math.min(over, S.waiting[s][bk]);
      S.waiting[s][bk] -= n;
      if (S.waiting[s][bk] <= 0) delete S.waiting[s][bk];
      over -= n;
      S.day.lost += n;
    }
  }
}

function earn(v, L) {
  S.money += v;
  S.month.rev += v;
  L.rev += v;
}

function arrive(tr, L, i) {
  const c = L.path[i];
  const T = TYPES[L.type];
  // 降車
  for (const key in tr.pax) {
    const [alight, dest] = key.split(',').map(Number);
    if (alight !== c) continue;
    const n = tr.pax[key];
    delete tr.pax[key];
    tr.load -= n;
    if (dest === c) { S.day.del += n; S.totalPax += n; S.month.pax += n; S.cities[c].arr += n; }
    else if (R[c] && R[c][dest]) S.waiting[c][dest] = (S.waiting[c][dest] || 0) + n;
  }
  // 折り返し
  if (i === 0) tr.dir = 1;
  else if (i === L.path.length - 1) tr.dir = -1;
  tr.next = i + tr.dir;
  // 乗車
  let boarded = 0, income = 0;
  const w = S.waiting[c];
  for (const k in w) {
    if (tr.load >= T.cap) break;
    const dest = +k;
    const r = R[c] && R[c][dest];
    if (!r || r.line !== L.id) continue;
    const ai = L.path.indexOf(r.alight);
    if ((ai - i) * tr.dir <= 0) continue;
    const n = Math.min(w[k], T.cap - tr.load);
    w[k] -= n;
    if (w[k] <= 0) delete w[k];
    const key = r.alight + ',' + dest;
    tr.pax[key] = (tr.pax[key] || 0) + n;
    tr.load += n;
    boarded += n;
    income += Math.abs(L._cum[ai] - L._cum[i]) * T.fare * L.fareMult * n;
  }
  S.cities[c].users += boarded;
  if (income > 0) {
    earn(income, L);
    if (income >= 1e4 && FX.length < 40) FX.push({ x: S.cities[c].x, y: S.cities[c].y, text: '+' + yen(income), life: 1 });
  }
  tr.dwell = 0.25 + (boarded / T.cap) * 0.5;
}

function moveTrain(tr, dt) {
  const L = lineById(tr.line);
  if (!L) return;
  if (tr.dwell > 0) { tr.dwell -= dt; return; }
  const target = L._cum[tr.next];
  const v = TYPES[L.type].speed * speedF() * dt;
  if (tr.dir > 0) { tr.pos += v; if (tr.pos >= target) { tr.pos = target; arrive(tr, L, tr.next); } }
  else { tr.pos -= v; if (tr.pos <= target) { tr.pos = target; arrive(tr, L, tr.next); } }
}

function dailyCost() {
  let veh = 0;
  S.trains.forEach(tr => { const L = lineById(tr.line); if (L) veh += TYPES[L.type].vehUp; });
  return (veh * costF() + (S._trackUp || 0)) / 30;
}

function onDay() {
  const c = dailyCost();
  S.money -= c;
  S.month.cost += c;
  const { del, lost } = S.day;
  if (del + lost > 0) {
    // 評判は「運べた割合」で決まる目標値へ少しずつ近づく
    const target = 30 + 70 * del / (del + lost * 4 + 1);
    S.rep = Math.max(0, Math.min(100, S.rep + (target - S.rep) * 0.04));
  }
  if (lost > 50) S._lostWarn = (S._lostWarn || 0) + 1;
  S.day = { del: 0, lost: 0 };
  const day = Math.floor(S.t / 24);
  S.effects = S.effects.filter(e => e.until > S.t);
  if (day >= S.nextEventDay && S.lines.length) { randomEvent(); S.nextEventDay = day + Math.round(rnd(8, 20)); }
  checkAch();
  checkGoals();
  dirtyPanel = true;
}

// 街の人口は毎月、自然増減＋鉄道サービスの良さ＋訪れた人の多さで変わる
function growCities() {
  const served = servedSet();
  S.cities.forEach((c, i) => {
    let rate = c.growth;
    if (served.has(i)) {
      rate += (S.rep - 45) / 6000;
      // 観光地は訪れる人が多いほど店や宿が増えて人が住みつく
      rate += c.tour >= 20 ? Math.min(0.03, c.arr / (c.pop * 1000) * 0.3) : Math.min(0.004, c.arr / (c.pop * 1000) * 0.05);
    }
    c.pop = Math.max(1, c.pop * (1 + rate));
    c.jobs = Math.max(1, c.jobs * (1 + rate * 0.7));
    c.hist.push(c.pop);
    if (c.hist.length > 24) c.hist.shift();
    c.usersPrev = c.users; c.users = 0;
    c.arrPrev = c.arr; c.arr = 0;
  });
}

function onMonth() {
  const interest = S.loan * 0.004;
  S.money -= interest;
  S.month.cost += interest;
  const d = dateAt(S.t - 1);
  const label = `${d.getUTCMonth() + 1}月`;
  const profit = S.month.rev - S.month.cost;
  S.hist.push({ label, rev: S.month.rev, cost: S.month.cost, pax: S.month.pax });
  if (S.hist.length > 12) S.hist.shift();
  log(`${label}決算：収入 ${yen(S.month.rev)} / 支出 ${yen(S.month.cost)} → ${profit >= 0 ? '黒字' : '赤字'} ${yen(profit)}`);
  if (profit > 0 && S.lines.length) unlock('profit');
  growCities();
  S.lines.forEach(L => { L.revPrev = L.rev; L.rev = 0; });
  S.month = { rev: 0, cost: 0, pax: 0 };
  if (S.money < 0) {
    S.negMonths++;
    if (S.negMonths >= 3) { S.over = true; showGameOver(); }
    else log(`⚠ 資金がマイナスです（${S.negMonths}/3か月）。3か月続くと経営破綻します。財務タブで借入できます。`);
  } else S.negMonths = 0;
  checkGoals();
  if (S.scenario && !S.result && !S.over && monthOf(S.t) >= S.endMonth) finishScenario(false);
  save();
}

const EVENTS = [
  { w: 3, run() {
    const c = pick([...servedSet()]);
    S.effects.push({ kind: 'fest', city: c, until: S.t + 24 * 4 });
    log(`${S.cities[c].name}で祭りが始まりました。4日間、この駅の需要が2.5倍です。`);
  } },
  { w: 2, run() {
    S.effects.push({ kind: 'storm', until: S.t + 24 * 3 });
    log('台風が接近中。3日間、全路線が徐行運転になります。');
  } },
  { w: 2, run() {
    S.effects.push({ kind: 'fuel', until: S.t + 24 * 30 });
    log('燃料と電気代が高騰。30日間、車両の維持費が1.4倍です。');
  } },
  { w: 1, run() {
    if (S.rep < 55) return false;
    const g = Math.round((3e7 + S.rep * 1e6) / 1e6) * 1e6;
    S.money += g;
    log(`評判の良さが認められ、自治体から補助金 ${yen(g)} を受け取りました。`);
  } },
  { w: 2, run() {
    const c = pick([...servedSet()]);
    const city = S.cities[c];
    city.pop *= 1.12;
    city.jobs *= 1.08;
    log(`${city.name}駅前で再開発が完成。人口が12%、働く場所が8%増えました。`);
  } },
];
function randomEvent() {
  const total = EVENTS.reduce((a, e) => a + e.w, 0);
  let r = Math.random() * total;
  for (const e of EVENTS) { r -= e.w; if (r <= 0) { if (e.run() !== false) toast(S.log[0].msg); return; } }
}

function step(dt) {
  const pd = Math.floor(S.t / 24), pm = monthOf(S.t);
  S.t += dt;
  genDemand(dt);
  for (const tr of S.trains) moveTrain(tr, dt);
  if (Math.floor(S.t / 24) !== pd) onDay();
  if (monthOf(S.t) !== pm) onMonth();
}

// ===== 実績 =====
function unlock(id) {
  if (S.ach[id]) return;
  S.ach[id] = S.t;
  const a = ACHIEVEMENTS.find(x => x[0] === id);
  log(`🏆 実績解除：${a[1]}`);
  toast(`実績解除：${a[1]}`);
}
function checkAch() {
  if (S.lines.length) unlock('firstLine');
  if (S.totalPax >= 1e4) unlock('pax10k');
  if (S.totalPax >= 1e6) unlock('pax1m');
  if (S.lines.some(l => l.type === 'hsr')) unlock('hsr');
  if (S.money - S.loan >= 1e9) unlock('net1b');
  if (S.money - S.loan >= 1e10) unlock('net10b');
  if (S.rep >= 90) unlock('rep90');
  if (servedSet().size === S.cities.length) unlock('allCities');
}

// ===== シナリオ =====
const cityName = i => CITY_DEFS[i].name;
const man = n => (n / 1e4 >= 1 ? (n / 1e4).toLocaleString(undefined, { maximumFractionDigits: 1 }) + '万' : n.toLocaleString());
// 目標は value（現在値）と target（目標値）を返す。一度達成すれば達成扱いのまま
const G = {
  lines: n => ({ label: `路線を${n}本以上運行する`, value: () => S.lines.length, target: n, fmt: v => v + '本' }),
  pax: n => ({ label: `累計乗客 ${man(n)}人`, value: () => S.totalPax, target: n, fmt: v => man(Math.round(v)) + '人' }),
  profit: () => ({ label: '月次決算で黒字を出す', value: () => (S.hist.some(h => h.rev > h.cost) ? 1 : 0), target: 1, fmt: v => (v ? '達成' : 'まだ') }),
  connect: (a, b) => ({ label: `${cityName(a)}と${cityName(b)}を路線で結ぶ`, value: () => (R[a] && R[a][b] ? 1 : 0), target: 1, fmt: v => (v ? '開通' : '未開通') }),
  users: (c, n) => ({ label: `${cityName(c)}駅の月間利用者 ${man(n)}人`, value: () => Math.max(S.cities[c].users, S.cities[c].usersPrev), target: n, fmt: v => man(Math.round(v)) + '人' }),

const scenarioOf = id => SCENARIOS.find(x => x.id === id);

function monthsLeft() { return Math.max(0, S.endMonth - monthOf(S.t)); }

// シナリオ開始時から走っている路線を、費用なしで敷く
function presetLine(type, path, trains, fareMult) {
  const T = TYPES[type];
  path.forEach((c, i) => {
    S.built.st[type + ':' + c] = 1;
    if (i > 0) S.built.seg[type + ':' + segKey(path[i - 1], c)] = 1;
  });
  const n = S.lines.filter(l => l.type === type).length + 1;
  const L = {
    id: S.nextId++, type, path: path.slice(), color: LINE_COLORS[S.lines.length % LINE_COLORS.length], fareMult,
    code: T.code + n, name: `${cityName(path[0])}〜${cityName(path[path.length - 1])}${type === 'bus' ? ' バス' : type === 'hsr' ? ' 新幹線' : '線'}`,
    rev: 0, revPrev: 0,
  };
  S.lines.push(L);
  lineGeom(L);
  const roundTrip = (L._len / T.speed + path.length * 0.4) * 2;
  for (let k = 0; k < trains; k++) S.trains.push({ id: S.nextId++, line: L.id, pos: 0, dir: 1, next: 0, dwell: roundTrip * k / trains, load: 0, pax: {} });
}

// ===== 建設 =====
function draftCost(dr) {
  const T = TYPES[dr.type];
  let c = 0;
  const seen = new Set();
  for (let i = 0; i < dr.path.length; i++) {
    const city = dr.path[i];
    const sk = dr.type + ':' + city;
    if (!S.built.st[sk] && !seen.has(sk)) { c += T.st; seen.add(sk); }
    if (i > 0) {
      const k = dr.type + ':' + segKey(dr.path[i - 1], city);
      if (!S.built.seg[k] && !seen.has(k)) { c += dist(S.cities[dr.path[i - 1]], S.cities[city]) * T.unit; seen.add(k); }
    }
  }
  if (!dr.lineId) c += T.veh;
  return c;
}
function startBuild(type, lineId) {
  const L = lineId ? lineById(lineId) : null;
  draft = { type, lineId: lineId || null, path: L ? L.path.slice() : [], base: L ? L.path.length : 0, prepend: false, added: 0 };
  renderBuildBar();
  if (window.innerWidth < 900) $('#panel').classList.add('collapsed');
  toast(L ? '延伸先の駅をタップしてください' : '始発駅をタップしてください');
}
function draftTap(c) {
  const city = S.cities[c];
  if (draft.path.includes(c)) { toast('同じ駅を2回通ることはできません'); return; }
  if (draft.type === 'hsr' && city.pop + city.jobs < HSR_MIN_SIZE && city.tag !== 'airport') { toast('新幹線の駅は大きな街（人口と就業者の合計25万人以上）か空港にしか置けません'); return; }
  if (draft.prepend) draft.path.unshift(c); else draft.path.push(c);
  draft.added++;

}
function renderBuildBar() {
  const bar = $('#buildBar');
  if (!draft) { bar.hidden = true; return; }
  const T = TYPES[draft.type];
  const cost = draftCost(draft);
  const ok = draft.path.length >= 2 && draft.added > 0;
  const names = draft.path.map(c => S.cities[c].name).join(' → ') || '（駅をタップ）';
  const L = draft.lineId && lineById(draft.lineId);
  bar.hidden = false;
  bar.innerHTML = `
    <div class="info">${L ? `<span class="badge" style="--c:${L.color}">${L.code}</span> ${L.name} を延伸` : `${T.name}の新路線`}　建設費 <b>${yen(cost)}</b>${!L ? '<span class="hint">（車両1' + T.unitName + '込み）</span>' : ''}
      <div class="route">${names}</div></div>
    <div class="row">
      ${L ? `<button class="btn" data-act="flip">${draft.prepend ? '終点側に延ばす' : '始点側に延ばす'}</button>` : ''}
      <button class="btn" data-act="undo" ${draft.added ? '' : 'disabled'}>1駅戻す</button>
      <button class="btn" data-act="cancelBuild">やめる</button>
      <button class="btn primary" data-act="commit" ${ok && cost <= S.money ? '' : 'disabled'}>${L ? '延伸する' : '開業する'}</button>
    </div>`;
}
function commitBuild() {
  const cost = draftCost(draft);
  if (cost > S.money) { toast('資金が足りません'); return; }
  const T = TYPES[draft.type];
  S.money -= cost;
  S.month.cost += cost;
  draft.path.forEach((c, i) => {
    S.built.st[draft.type + ':' + c] = 1;
    if (i > 0) S.built.seg[draft.type + ':' + segKey(draft.path[i - 1], c)] = 1;
  });
  if (draft.lineId) {
    const L = lineById(draft.lineId);
    const addedFront = draft.prepend ? draft.path.length - L.path.length : 0;
    L.path = draft.path.slice();
    lineGeom(L);
    // 始点側に延ばした場合は、走行中の車両の位置を新しい起点からの距離に付け替える
    if (addedFront) {
      const front = L._cum[addedFront];
      S.trains.filter(t => t.line === L.id).forEach(t => { t.next += addedFront; t.pos += front; });
    }
    log(`${L.code} ${L.name}を${S.cities[draft.prepend ? L.path[0] : L.path[L.path.length - 1]].name}まで延伸しました（${yen(cost)}）。`);
  } else {
    const n = S.lines.filter(l => l.type === draft.type).length + 1;
    const used = new Set(S.lines.map(l => l.color));
    const color = LINE_COLORS.find(c => !used.has(c)) || pick(LINE_COLORS);
    const a = S.cities[draft.path[0]].name, b = S.cities[draft.path[draft.path.length - 1]].name;
    const L = {
      id: S.nextId++, type: draft.type, path: draft.path.slice(), color, fareMult: 1,
      code: T.code + n, name: `${a}〜${b}${draft.type === 'bus' ? ' バス' : draft.type === 'hsr' ? ' 新幹線' : '線'}`,
      rev: 0, revPrev: 0,
    };
    S.lines.push(L);
    lineGeom(L);
    S.trains.push({ id: S.nextId++, line: L.id, pos: 0, dir: 1, next: 0, dwell: 0, load: 0, pax: {} });
    log(`${L.code} ${L.name}が開業しました（${yen(cost)}）。`);
    selLine = L.id;
    tab = 'lines';
  }
  draft = null;
  renderBuildBar();
  $('#panel').classList.remove('collapsed');
  rebuild();
  checkAch();
  syncTabs();
}

function addTrain(L) {
  const T = TYPES[L.type];
  if (S.money < T.veh) { toast('資金が足りません'); return; }
  S.money -= T.veh;
  S.month.cost += T.veh;
  const count = S.trains.filter(t => t.line === L.id).length;
  const roundTrip = (L._len / T.speed + L.path.length * 0.4) * 2;
  S.trains.push({ id: S.nextId++, line: L.id, pos: 0, dir: 1, next: 0, dwell: (roundTrip / (count + 1)) * 0.5, load: 0, pax: {} });
  rebuild();
  toast(`${L.code}に${T.name}車両を1${T.unitName}追加しました`);
}
function sellTrain(L) {

  if (list.length <= 1) { toast('最後の1両は売却できません。不要なら路線ごと廃止してください'); return; }
  const tr = list.reduce((a, b) => (a.load <= b.load ? a : b));
  S.trains.splice(S.trains.indexOf(tr), 1);
  const back = TYPES[L.type].veh * 0.5;
  S.money += back;

  toast(`車両を売却しました（${yen(back)}）`);

function removeLine(L) {

  S.trains = S.trains.filter(t => t.line !== L.id);
  S.lines = S.lines.filter(l => l !== L);
  S.money += back;
  log(`${L.code} ${L.name}を廃止しました。車両売却益 ${yen(back)}。線路と駅は残るので再利用できます。`);

// ===== 描画 =====
const cv = $('#map'), ctx = cv.getContext('2d');
let dpr = 1, CW = 0, CH = 0;
const COL = {};
function readColors() {
  const cs = getComputedStyle(document.documentElement);
  ['bg', 'board', 'fg', 'muted', 'led', 'good', 'bad', 'land', 'land-2', 'sea', 'river', 'grid', 'rule'].forEach(k => COL[k] = cs.getPropertyValue('--' + k).trim());
}
let terrain;
function buildTerrain() {
  const sc = 2;
  terrain = document.createElement('canvas');
  terrain.width = W * sc; terrain.height = H * sc;
  const g = terrain.getContext('2d');
  g.scale(sc, sc);
  g.fillStyle = COL.land; g.fillRect(0, 0, W, H);
  // 標高の濃淡
  for (let i = 0; i < 60; i++) {
    g.fillStyle = COL['land-2'];
    g.globalAlpha = 0.35;
    g.beginPath();
    g.arc((i * 137) % W, (i * 89) % H, 30 + (i * 13) % 50, 0, 7);
    g.fill();
  }
  g.globalAlpha = 1;
  // 山地
  g.strokeStyle = 'rgba(160,180,210,0.18)';
  g.lineWidth = 1.2;
  [[60, 60], [130, 40], [200, 75], [40, 220], [160, 110], [250, 40], [340, 60], [560, 40], [600, 70]].forEach(([x, y]) => {
    g.beginPath(); g.moveTo(x - 16, y + 12); g.lineTo(x, y - 10); g.lineTo(x + 16, y + 12); g.stroke();
  });
  // 湖
  g.fillStyle = COL.sea;
  g.beginPath(); g.ellipse(140, 610, 60, 34, -0.3, 0, 7); g.fill();
  // 川
  g.strokeStyle = COL.river; g.lineWidth = 7; g.lineCap = 'round';
  g.beginPath(); g.moveTo(560, 0);
  g.bezierCurveTo(520, 140, 620, 230, 585, 330);
  g.bezierCurveTo(550, 440, 640, 520, 615, 640);
  g.lineTo(640, 700); g.stroke();
  // 海
  g.fillStyle = COL.sea;
  g.beginPath(); SEA.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath(); g.fill();
  g.strokeStyle = 'rgba(120,170,230,0.25)'; g.lineWidth = 1.5; g.stroke();
  g.strokeStyle = 'rgba(120,170,230,0.08)'; g.lineWidth = 1;
  for (let y = 360; y < 700; y += 14) { g.beginPath(); g.moveTo(860, y); g.lineTo(1000, y); g.stroke(); }
  g.fillStyle = COL.land; g.globalAlpha = 1;
  // 格子（路線図ボードの方眼）
  g.strokeStyle = COL.grid; g.lineWidth = 1;
  for (let x = 0; x <= W; x += 50) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  for (let y = 0; y <= H; y += 50) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
}

function resize() {
  const r = cv.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1;
  CW = r.width; CH = r.height;
  cv.width = Math.round(CW * dpr); cv.height = Math.round(CH * dpr);
}
function fitView() {
  const s = Math.min(CW / (W + 40), CH / (H + 40));
  view.s = s;
  view.x = (CW - W * s) / 2;
  view.y = (CH - H * s) / 2;
}
function zoomAt(f, sx, sy) {
  const ns = Math.max(0.2, Math.min(6, view.s * f));
  view.x = sx - (sx - view.x) * ns / view.s;
  view.y = sy - (sy - view.y) * ns / view.s;
  view.s = ns;
}
const toWorld = (sx, sy) => ({ x: (sx - view.x) / view.s, y: (sy - view.y) / view.s });

function segOffset(L, a, b) {
  const arr = segLines[segKey(a, b)] || [L.id];
  const n = arr.length, idx = Math.max(0, arr.indexOf(L.id));
  const lo = S.cities[Math.min(a, b)], hi = S.cities[Math.max(a, b)];
  const dx = hi.x - lo.x, dy = hi.y - lo.y, len = Math.hypot(dx, dy) || 1;
  const off = (idx - (n - 1) / 2) * 7 / view.s;
  return { ox: -dy / len * off, oy: dx / len * off };
}
function linePoint(L, pos) {
  const cum = L._cum;
  let k = 0;
  while (k < cum.length - 2 && pos > cum[k + 1]) k++;
  const a = S.cities[L.path[k]], b = S.cities[L.path[k + 1]];
  const f = (pos - cum[k]) / ((cum[k + 1] - cum[k]) || 1);
  const { ox, oy } = segOffset(L, L.path[k], L.path[k + 1]);
  return { x: a.x + (b.x - a.x) * f + ox, y: a.y + (b.y - a.y) * f + oy, ang: Math.atan2(b.y - a.y, b.x - a.x) };
}
function strokeLine(L, path, alpha) {
  const T = TYPES[L.type];
  const px = 1 / view.s;
  ctx.globalAlpha = alpha;
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (let i = 1; i < path.length; i++) {
    const a = S.cities[path[i - 1]], b = S.cities[path[i]];
    const { ox, oy } = L.id ? segOffset(L, path[i - 1], path[i]) : { ox: 0, oy: 0 };
    ctx.beginPath(); ctx.moveTo(a.x + ox, a.y + oy); ctx.lineTo(b.x + ox, b.y + oy);
    ctx.strokeStyle = L.color; ctx.lineWidth = T.w * px;
    ctx.setLineDash(L.type === 'bus' ? [6 * px, 4 * px] : []);
    ctx.stroke();
    if (L.type === 'hsr') {
      ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1.4 * px;
      ctx.setLineDash([10 * px, 6 * px]); ctx.stroke();
    }
  }
  ctx.setLineDash([]);
  ctx.globalAlpha = 1;
}

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = COL.sea;
  ctx.fillRect(0, 0, CW, CH);
  ctx.save();
  ctx.translate(view.x, view.y);
  ctx.scale(view.s, view.s);
  ctx.drawImage(terrain, 0, 0, W, H);
  const px = 1 / view.s;
  const served = servedSet();

  // 路線
  S.lines.forEach(L => strokeLine(L, L.path, selLine && selLine !== L.id && tab === 'lines' ? 0.35 : 1));
  if (draft && draft.path.length) {
    const ghost = { id: 0, type: draft.type, color: COL.led };
    strokeLine(ghost, draft.path, 0.9);
  }

  // 都市・駅
  const font = (sz, w) => `${w || 500} ${sz * px}px ${getComputedStyle(document.body).fontFamily}`;
  S.cities.forEach((c, i) => {
    const isSt = served.has(i);
    const r = (3 + Math.sqrt(c.pop + c.jobs * 0.5 + c.tour) / 4.5) * px;
    if (selCity === i) {
      ctx.strokeStyle = COL.led; ctx.lineWidth = 2 * px;
      ctx.beginPath(); ctx.arc(c.x, c.y, r + 7 * px, 0, 7); ctx.stroke();
    }
    if (draft && draft.path.includes(i)) {
      ctx.fillStyle = COL.led; ctx.globalAlpha = 0.3;
      ctx.beginPath(); ctx.arc(c.x, c.y, r + 6 * px, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
    }
    if (isSt) {
      // 待ち客の混雑リング

      if (ratio > 0.02) {
        ctx.strokeStyle = ratio > 0.8 ? COL.bad : COL.led;
        ctx.lineWidth = 3 * px;
        ctx.beginPath(); ctx.arc(c.x, c.y, r + 3.5 * px, -Math.PI / 2, -Math.PI / 2 + ratio * Math.PI * 2); ctx.stroke();
      }
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#0b1220';
      ctx.lineWidth = 2.5 * px;
      ctx.beginPath(); ctx.arc(c.x, c.y, r, 0, 7); ctx.fill(); ctx.stroke();
    } else {
      ctx.strokeStyle = 'rgba(200,215,235,0.55)';
      ctx.fillStyle = COL.land;
      ctx.lineWidth = 1.5 * px;
      ctx.beginPath(); ctx.arc(c.x, c.y, r * 0.75, 0, 7); ctx.fill(); ctx.stroke();
    }
    ctx.font = font(12, isSt ? 700 : 500);
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.lineWidth = 3 * px; ctx.strokeStyle = 'rgba(8,14,26,0.85)';
    ctx.strokeText(c.name, c.x, c.y + r + 5 * px);
    ctx.fillStyle = isSt ? COL.fg : COL.muted;
    ctx.fillText(c.name, c.x, c.y + r + 5 * px);
    let ty = c.y + r + 19 * px;
    if (view.s > 0.75) {
      const label = man(Math.round(c.pop * 1000)) + '人';
      ctx.font = font(10);
      ctx.fillStyle = COL.muted;
      ctx.strokeText(label, c.x, ty);
      ctx.fillText(label, c.x, ty);
      ty += 13 * px;
    }
    if (isSt && view.s > 0.55) {
      const wt = waitTotal(i);
      if (wt > 0) {
        ctx.font = font(10);
        ctx.fillStyle = wt / waitCap(i) > 0.8 ? COL.bad : COL.led;
        ctx.strokeText('待' + wt, c.x, ty);
        ctx.fillText('待' + wt, c.x, ty);
      }
    }
  });

  // 車両
  S.trains.forEach(tr => {
    const L = lineById(tr.line);
    if (!L || !L._cum) return;
    const T = TYPES[L.type];
    const p = linePoint(L, tr.pos);
    const len = (L.type === 'bus' ? 9 : L.type === 'rail' ? 15 : 22) * px, wd = (L.type === 'bus' ? 6 : 7) * px;
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(p.ang);
    ctx.fillStyle = '#0b1220';
    ctx.fillRect(-len / 2 - px, -wd / 2 - px, len + 2 * px, wd + 2 * px);
    ctx.fillStyle = L.color;
    ctx.fillRect(-len / 2, -wd / 2, len, wd);
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillRect(-len / 2 + px, -wd / 2 + px, (len - 2 * px) * (tr.load / T.cap), wd - 2 * px);
    ctx.restore();
  });

  // 収入の浮き文字
  ctx.font = font(11, 700);
  ctx.textAlign = 'center';
  FX.forEach(f => {
    ctx.globalAlpha = Math.max(0, f.life);
    ctx.fillStyle = COL.good;
    ctx.fillText(f.text, f.x, f.y - (1 - f.life) * 30 * px - 18 * px);
  });
  ctx.globalAlpha = 1;
  ctx.restore();
}

const pointers = new Map();
let dragInfo = null;
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.offsetX, y: e.offsetY });
  if (pointers.size === 1) dragInfo = { sx: e.offsetX, sy: e.offsetY, vx: view.x, vy: view.y, moved: false };
  else if (pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    dragInfo = { pinch: Math.hypot(a.x - b.x, a.y - b.y), s: view.s, moved: true };
  }
});
cv.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.offsetX, y: e.offsetY });
  if (!dragInfo) return;
  if (pointers.size === 2 && dragInfo.pinch) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    zoomAt((dragInfo.s * d / dragInfo.pinch) / view.s, (a.x + b.x) / 2, (a.y + b.y) / 2);
  } else if (pointers.size === 1 && !dragInfo.pinch) {
    const dx = e.offsetX - dragInfo.sx, dy = e.offsetY - dragInfo.sy;
    if (Math.hypot(dx, dy) > 6) dragInfo.moved = true;
    if (dragInfo.moved) { view.x = dragInfo.vx + dx; view.y = dragInfo.vy + dy; }
  }
});
function endPointer(e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if (pointers.size === 0) {
    if (dragInfo && !dragInfo.moved) tapAt(e.offsetX, e.offsetY);
    dragInfo = null;
  }
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.offsetX, e.offsetY); }, { passive: false });
$('#zIn').onclick = () => zoomAt(1.3, CW / 2, CH / 2);

function tapAt(sx, sy) {
  const p = toWorld(sx, sy);
  let best = -1, bd = 26 / view.s;
  S.cities.forEach((c, i) => { const d = Math.hypot(c.x - p.x, c.y - p.y); if (d < bd) { bd = d; best = i; } });
  if (draft) { if (best >= 0) draftTap(best); return; }
  if (best >= 0) { selCity = best; tab = 'station'; }
  else selCity = null;
  syncTabs();
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const act = b.dataset.act;
  const L = b.dataset.line ? lineById(+b.dataset.line) : null;
  const needConfirm = { removeLine: 1 };
  if (needConfirm[act] && pendingConfirm !== act + (L ? L.id : '')) {
    pendingConfirm = act + (L ? L.id : '');
    renderPanel();
    return;
  }
  pendingConfirm = null;
  switch (act) {
    case 'openLine': selLine = +b.dataset.line; tab = 'lines'; syncTabs(); return;
    case 'back': selLine = null; break;
    case 'build': startBuild(b.dataset.type); break;
    case 'extend': startBuild(L.type, L.id); break;
    case 'flip': draft.prepend = !draft.prepend; renderBuildBar(); return;
    case 'undo':
      if (draft.added) { draft.prepend ? draft.path.shift() : draft.path.pop(); draft.added--; }
      if (draft.lineId && draft.added === 0) draft.path = lineById(draft.lineId).path.slice();
      renderBuildBar(); return;
    case 'cancelBuild': draft = null; renderBuildBar(); $('#panel').classList.remove('collapsed'); return;
    case 'commit': commitBuild(); return;
    case 'addTrain': addTrain(L); break;
    case 'sellTrain': sellTrain(L); break;
    case 'removeLine': removeLine(L); break;
    case 'borrow': S.loan += 1e8; S.money += 1e8; log('銀行から1億円を借り入れました（月利0.4%）。'); break;
    case 'repay': if (S.money >= 1e8 && S.loan >= 1e8) { S.loan -= 1e8; S.money -= 1e8; log('借入金を1億円返済しました。'); } break;
    case 'save': save(); toast('保存しました'); break;

    case 'closeOverlay':

    case 'title': save(); showTitle(); return;
    case 'continue': S = load() || newGame(); initGame(); $('#overlay').hidden = true; return;
    case 'newFree': newRun(null); return;
    case 'newScenario': newRun(b.dataset.id); return;

});

    h += '<h3>フリープレイ</h3><p class="hint">期限も目標もありません。下の実績を目安に、自由に路線網を広げてください。シナリオはタイトル画面から選べます。</p>';
  }
  h += `<h3>実績</h3><div class="ach">${ACHIEVEMENTS.map(([id, nm]) => `<div class="${S.ach[id] ? 'got' : ''}">${S.ach[id] ? '★' : '☆'} ${nm}</div>`).join('')}</div>`;
  return h;
}
function drawFinChart() {
  const c = document.getElementById('finChart');
  if (!c) return;
  const r = c.getBoundingClientRect();
  c.width = r.width * dpr; c.height = r.height * dpr;
  const g = c.getContext('2d');
  g.scale(dpr, dpr);
  const data = S.hist.concat([{ label: '今月', rev: S.month.rev, cost: S.month.cost }]);
  const max = Math.max(1, ...data.map(d => Math.max(d.rev, d.cost)));
  const bw = r.width / Math.max(6, data.length);
  const top = 6, base = r.height - 18;
  g.strokeStyle = COL.rule; g.lineWidth = 1;
  g.beginPath(); g.moveTo(0, base + 0.5); g.lineTo(r.width, base + 0.5); g.stroke();
  g.font = `10px ${getComputedStyle(document.body).fontFamily}`;
  g.textAlign = 'center'; g.fillStyle = COL.muted;
  data.forEach((d, i) => {
    const x = i * bw + bw * 0.15, w = bw * 0.33;
    const hr = (d.rev / max) * (base - top), hc = (d.cost / max) * (base - top);
    g.fillStyle = COL.good; g.fillRect(x, base - hr, w, hr);
    g.fillStyle = COL.bad; g.fillRect(x + w + 2, base - hc, w, hc);
    g.fillStyle = COL.muted; g.fillText(d.label, x + w, base + 13);
  });
  g.textAlign = 'right'; g.fillStyle = COL.muted;
  g.fillText(yen(max), r.width - 2, 10);
}

function updateHud() {
  const m = $('#hMoney');
  m.textContent = yen(S.money);
  m.classList.toggle('neg', S.money < 0);
  $('#hDate').textContent = dateStr(S.t, true);
  $('#hRep').textContent = Math.round(S.rep) + (effActive('storm') ? ' 台風' : '');
  const showLeft = !!(S.scenario && !S.result);
  $('#mLeft').hidden = !showLeft;
  if (showLeft) $('#hLeft').textContent = monthsLeft() + 'か月';
}

// ===== オーバーレイ =====
let overlayBack = null;   // 遊び方を閉じたときに戻る画面
function overlay(html) {
  const o = $('#overlay');
  o.innerHTML = `<div class="card">${html}</div>`;
  o.hidden = false;
  o.querySelector('.card').scrollTop = 0;
}
function showHelp(back) {
  overlayBack = back || null;
  overlay(`<h2>遊び方</h2>
    <p>あなたは交通会社の社長です。20の街を鉄道・バス・新幹線で結び、会社を大きくしてください。</p>
    <ol>
      <li>「建設」タブで交通手段を選び、地図の駅を順にタップして「開業する」。</li>
      <li>乗客は、住む人の多い街から働く場所の多い街への通勤と、観光地への旅行で生まれます。朝夕のラッシュと週末の行楽で増え方が変わります。乗り換えは自動です。</li>
      <li>「都市」タブで街ごとの人口・働く人・観光の人気・駅の利用者が見られます。駅があって評判が良い街ほど人口が増えます。</li>
      <li>ホームの待ち客（駅の周りのリング）が赤くなったら車両を増やしましょう。あふれると評判が下がります。</li>
      <li>運賃を上げると1人あたりの収入は増えますが、乗客は減ります。</li>
      <li>毎月、車両と線路の維持費がかかります。資金がマイナスのまま3か月続くと破綻です。</li>
    </ol>
    <p class="hint">地図はドラッグで移動、ホイールかピンチで拡大できます。表示中のタブをもう一度押すとパネルを畳めます。進行は毎月自動保存されます。</p>
    <button class="btn primary" data-act="closeOverlay">${back === 'title' ? '戻る' : back === 'game' ? '閉じる' : '運行開始'}</button>`);
}
function showTitle() {
  speed = 1; syncSpeed();
  overlayBack = null;
  const saved = load();
  const clears = loadClears();
  const canContinue = saved && !saved.over && !(saved.result && !saved.result.win);
  const savedName = saved && saved.scenario ? `シナリオ「${scenarioOf(saved.scenario).name}」` : 'フリープレイ';
  overlay(`<h2>みなと交通指令所</h2>
    <p class="desc">鉄道・バス・新幹線で20の街を結ぶ、交通会社の経営ゲーム。</p>
    ${canContinue ? `<button class="btn primary" data-act="continue">続きから　<span style="font-weight:400">${savedName}・${dateStr(saved.t)}</span></button>` : ''}
    <h3>シナリオ</h3>
    <div class="scList">${SCENARIOS.map(sc => `<div class="sc">
      <div class="top"><b>${sc.name}</b><span class="lv">難易度 ${'●'.repeat(sc.level)}${'○'.repeat(5 - sc.level)}</span></div>
      <p class="hint">${sc.brief}</p>
      <div class="foot"><span class="hint">期限 ${sc.months}か月　<span class="stars">${clears[sc.id] ? '★'.repeat(clears[sc.id]) + '☆'.repeat(3 - clears[sc.id]) : '未クリア'}</span></span>
      <button class="btn" data-act="newScenario" data-id="${sc.id}">挑戦する</button></div></div>`).join('')}</div>
    <h3>フリープレイ</h3>
    <p class="hint">期限も目標もなく、資金5億円から自由に路線網を広げます。</p>
    <div class="row"><button class="btn" data-act="newFree">フリープレイを始める</button><button class="btn" data-act="help">遊び方</button></div>
    ${saved ? '<p class="hint">新しく始めると、今の続きのデータは上書きされます。</p>' : ''}`);
}
function showBriefing() {
  const sc = scenarioOf(S.scenario);
  overlay(`<h2>${sc.name}</h2>
    <p class="desc">${sc.brief}</p>
    <dl class="kv"><dt>資金</dt><dd class="num">${yen(S.money)}</dd>${S.loan ? `<dt>借入金</dt><dd class="num">${yen(S.loan)}</dd>` : ''}
      <dt>期限</dt><dd>${sc.months}か月（${dateStr(S.t)} 〜）</dd></dl>
    <h3>目標</h3><ol>${sc.goals().map(g => `<li>${g.label}</li>`).join('')}</ol>
    <p class="hint">目標はすべて、期限内に一度でも達成すればクリアです。進み具合は「目標」タブで確認できます。期限の半分以内なら★3つ、4分の3以内なら★2つです。</p>
    <button class="btn primary" data-act="closeOverlay">運行開始</button>`);
}
function showResult() {
  speed = 0; syncSpeed();
  const sc = scenarioOf(S.scenario);
  const r = S.result;
  const goals = sc.goals().map((g, i) => `<li>${S.goalDone[i] ? '✓' : '✗'} ${g.label}</li>`).join('');
  overlay(r.win
    ? `<h2>シナリオクリア</h2><p class="stars" style="font-size:28px">${'★'.repeat(r.stars)}${'☆'.repeat(3 - r.stars)}</p>
       <p>「${sc.name}」を ${r.months}か月 で達成しました。</p><ul style="margin:0;padding-left:1.2em">${goals}</ul>
       <div class="row"><button class="btn primary" data-act="closeOverlay">このまま経営を続ける</button><button class="btn" data-act="title">タイトルへ</button></div>`
    : `<h2>期限切れ</h2><p>「${sc.name}」の期限 ${sc.months}か月 が過ぎました。</p><ul style="margin:0;padding-left:1.2em">${goals}</ul>
       <div class="row"><button class="btn primary" data-act="newScenario" data-id="${sc.id}">もう一度挑戦</button><button class="btn" data-act="title">タイトルへ</button></div>`);
}
function showGameOver() {
  speed = 0; syncSpeed();
  overlay(`<h2>経営破綻</h2>
    <p>資金不足が3か月続き、会社は経営破綻しました。</p>
    <dl class="kv"><dt>営業期間</dt><dd>${dateStr(0)} 〜 ${dateStr(S.t)}</dd><dt>累計乗客</dt><dd class="num">${S.totalPax.toLocaleString()}人</dd><dt>路線数</dt><dd>${S.lines.length}</dd></dl>
    <div class="row">${S.scenario ? `<button class="btn primary" data-act="newScenario" data-id="${S.scenario}">もう一度挑戦</button>` : '<button class="btn primary" data-act="newFree">新しい会社で再挑戦</button>'}
    <button class="btn" data-act="title">タイトルへ</button></div>`);
}

// ===== 保存 =====
function save() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* 保存できない環境では何もしない */ }
}
function load() {
  try {
    const o = JSON.parse(localStorage.getItem(SAVE_KEY));
    return o && o.v === 2 ? o : null;
  } catch (e) { return null; }
}

// ===== 起動 =====
let looping = false;
function initGame() {
  selLine = null; selCity = null; draft = null; FX = []; ACC = [];
  tab = 'lines';
  $('#toast').style.opacity = 0;
  $('#panel').classList.remove('collapsed');
  fitView();
  rebuild();
  renderBuildBar();
  syncSpeed(); syncTabs();
}
function newRun(id) {
  S = newGame();
  if (id) {
    const sc = scenarioOf(id);
    S.scenario = id;
    sc.setup();
    S.endMonth = monthOf(S.t) + sc.months;
    log(`シナリオ「${sc.name}」を開始しました。`);
  } else log('フリープレイを開始しました。');
  speed = 1;
  initGame();
  save();
  if (id) showBriefing(); else showHelp();
}
function start(data) {
  readColors();
  if (!terrain) buildTerrain();
  resize();
  const hot = data && data.state;
  S = (hot && hot.v === 2 ? hot : null) || load() || newGame();
  initGame();
  if (hot && hot.v === 2) $('#overlay').hidden = true;
  else showTitle();
  if (!looping) { looping = true; requestAnimationFrame(frame); }
}
let last = performance.now(), panelTimer = 0;
function frame(now) {
  const real = Math.min(0.1, (now - last) / 1000);
  last = now;
  if (!S.over && speed > 0 && $('#overlay').hidden) {
    let hours = real * speed / HOUR_SEC;
    while (hours > 0) { const dt = Math.min(0.1, hours); step(dt); hours -= dt; }
  }
  FX.forEach(f => (f.life -= real * 0.8));
  FX = FX.filter(f => f.life > 0);
  draw();
  updateHud();
  panelTimer += real;
  const active = document.activeElement;
  const editing = active && active.tagName === 'INPUT';
  if ((dirtyPanel || panelTimer > 1) && !editing) { panelTimer = 0; renderPanel(); if (draft) renderBuildBar(); }
  requestAnimationFrame(frame);
}
new ResizeObserver(() => {
  if (!S) return;
  const ow = CW, oh = CH;
  const wasFit = Math.abs(view.s - Math.min(ow / (W + 40), oh / (H + 40))) < 1e-6;
  resize();
  if (wasFit) fitView();
  else { view.x += (CW - ow) / 2; view.y += (CH - oh) / 2; }
}).observe($('#mapWrap'));
window.addEventListener('pagehide', save);
window.claude?.hot?.snapshot?.(() => ({ state: S }));
const boot = data => start(data || {});
document.fonts && document.fonts.ready.then(() => { dirtyPanel = true; });
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
